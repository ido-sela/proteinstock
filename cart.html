<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>עגלת קניות — פרוטאין סטוק - PROTEIN STOCK</title>
<meta name="robots" content="noindex,follow">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="img/protein-stock-sports-nutrition-e-commerce-logo.webp">
<link rel="stylesheet" href="css/style.css">
<style>
.sn-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:1000}
.sn-box{position:relative;background:#fff;color:#111;border-radius:16px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:22px 18px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sn-box h2{margin:6px 0 6px;font-size:1.35rem}
.sn-box p{margin:0 0 14px;color:#444}
.sn-i{font-size:2.2rem}
.sn-x{position:absolute;top:10px;left:12px;border:0;background:none;font-size:1.2rem;cursor:pointer;color:#555}
.sn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:14px;text-align:right}
.sn-act{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.sn-skip{border:0;background:none;text-decoration:underline;cursor:pointer;color:#555;font:inherit}
</style>
</head>
<body>
<main id="main"><div class="wrap ct" id="ct"></div></main>
<script src="js/data.js"></script>
<script src="js/catalog.js"></script>
<script src="js/app.js"></script>
<script>
layout('cart');
const host = document.getElementById('ct');
const NOTE_KEY = 'ps_note';
const getNote = () => { try { return sessionStorage.getItem(NOTE_KEY) || ''; } catch (e) { return ''; } };
const setNote = v => { try { sessionStorage.setItem(NOTE_KEY, v.slice(0, 300)); } catch (e) { /* ignore */ } };

let giveUp = false; setTimeout(() => { giveUp = true; draw(); }, 4000);
/* items that are not in the built-in catalog (added in the admin) are known only after the live catalog loads */
const pending = () => Cart.stored.length > Cart.items.filter(i => byId(i.id)).length && !window.__liveReady && !giveUp;
function draw() {
  const items = Cart.items.filter(i => byId(i.id));
  if (pending()) { host.innerHTML = '<div class="ct-empty"><p>טוען את העגלה…</p></div>'; return; }
  if (!items.length) {
    host.innerHTML = `<div class="ct-empty"><div class="ct-empty-i">🛒</div><h1>העגלה שלך ריקה</h1><p>עוד לא הוספת מוצרים. בוא נמצא משהו טוב.</p><a class="btn btn-primary" href="products">להמשך קנייה</a></div>`;
    return;
  }
  /* a saved coupon lowers the total before free shipping is decided, exactly as the server does at checkout */
  const cp = (() => { try { return sessionStorage.getItem('ps_coupon') || ''; } catch (e) { return ''; } })();
  const qKey = cp + '|' + items.map(i => i.id + 'x' + i.q).join(',');
  const qt = window.__cartQ && window.__cartQ.key === qKey ? window.__cartQ : null;
  if (cp && !qt && !window.__cartQBusy) {
    window.__cartQBusy = true;
    const qb = JSON.stringify({ action: 'quote', coupon: cp, items: items.map(i => ({ id: i.id, qty: i.q })) });
    fetch('/api/create-order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: qb })
      .then(r => (r.status === 404 || r.status === 503)   // new database not set up yet: legacy Supabase function (remove after the move)
        ? fetch(LEGACY_SB.url + '/functions/v1/create-order', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: LEGACY_SB.key }, body: qb }) : r)
      .then(r => r.json()).then(j => { window.__cartQ = { key: qKey, discount: Number(j.discount) || 0, code: j.coupon || '' }; }).catch(() => { window.__cartQ = { key: qKey, discount: 0, code: '' }; })
      .finally(() => { window.__cartQBusy = false; draw(); });
  }
  const disc = qt ? qt.discount : 0, after = Cart.total() - disc;
  const sub = Cart.total(), ship = shipCost(after, sub), left = shipGap(after, sub);
  const pct = SHIP.free_over > 0 ? Math.min(100, Math.round(after / (after + left) * 100)) : 100;
  const bar = SHIP.free_over > 0 ? `<div class="ct-ship"><p>${left > 0 ? `עוד <b>${money(left)}</b> ומקבלים משלוח חינם` : '🎉 מגיע לך משלוח חינם'}</p><div class="ct-bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div></div>` : '';
  const rows = items.map(i => {
    const p = byId(i.id);
    return `<div class="ct-row" data-id="${esc(p.id)}">
      <a class="ct-img" href="${purl(p.id)}"><img src="${thumb(p.img)}" alt="${esc(p.name)}" width="96" height="96" loading="lazy"></a>
      <div class="ct-info"><span class="pbrand">${esc(p.brand || '')}</span><a class="ct-name" href="${purl(p.id)}">${esc(p.name)}</a>${i.v ? `<span class="ct-v">הרכב המארז: ${esc(i.v)}</span>` : ''}
        <span class="ct-unit">${money(p.price)}${p.sale ? `<s>${money(p.old)}</s>` : ''}</span>
        ${p.out ? '<span class="ct-warn">המוצר אזל מהמלאי. יש להסיר אותו כדי להמשיך.</span>' : ''}</div>
      <div class="ct-qty" role="group" aria-label="כמות"><button type="button" aria-label="הפחת" data-q="${Cart.items.indexOf(i)}:-1">−</button><span aria-live="polite">${i.q}</span><button type="button" aria-label="הוסף" data-q="${Cart.items.indexOf(i)}:1">+</button></div>
      <b class="ct-line">${money(p.price * i.q)}</b>
      <button type="button" class="ct-rm" data-q="${Cart.items.indexOf(i)}:rm" aria-label="הסר: ${esc(p.name)}">✕</button></div>`;
  }).join('');
  const blocked = items.some(i => byId(i.id).out);
  const rel = PRODUCTS.filter(x => !x.out && !items.some(i => i.id === x.id) && items.some(i => byId(i.id).cat === x.cat)).slice(0, 4);
  host.innerHTML = `<div class="ct-head"><h1>העגלה שלי</h1><span>${Cart.count()} פריטים</span></div>
  <div class="ct-grid"><section class="ct-list" aria-label="פריטים בעגלה">${bar}${rows}
      <label class="ct-note"><span>הערה להזמנה (לא חובה)</span><textarea id="ct-note" rows="2" maxlength="300" placeholder="למשל: להתקשר לפני ההגעה">${esc(getNote())}</textarea></label></section>
    <aside class="ct-sum" aria-label="סיכום הזמנה"><h2>סיכום הזמנה</h2>
      <div class="ct-l"><span>סכום ביניים</span><b>${money(sub)}</b></div>
      ${disc ? `<div class="ct-l"><span>הנחת קופון${qt.code ? " " + esc(qt.code) : ""}</span><b style="color:var(--ok)">-${money(disc)}</b></div>` : ""}<div class="ct-l"><span>משלוח</span><b>${ship ? money(ship) : 'חינם'}</b></div>
      <div class="ct-l tot"><span>סה"כ</span><b>${money(after + ship)}</b></div>
      <p class="ct-vat">המחיר כולל מע"מ. המשלוח מחושב סופית בקופה.</p>
      <a class="btn btn-primary ct-go${blocked ? ' dis' : ''}" href="${blocked ? '#' : 'checkout'}" ${blocked ? 'aria-disabled="true"' : ''}>המשך לתשלום</a>
      <a class="ct-more" href="products">← המשך קנייה</a>
      <ul class="ct-trust"><li>🔒 תשלום מאובטח בדף מוצפן</li><li>🚚 משלוחים לכל הארץ</li><li>↩ ביטול עסקה לפי חוק הגנת הצרכן</li></ul></aside></div>
  ${rel.length ? `<section class="ct-rel"><h2>אולי יעניין אותך גם</h2><div class="grid">${rel.map(card).join('')}</div></section>` : ''}`;
  const note = document.getElementById('ct-note'); if (note) note.oninput = () => setNote(note.value);
  const go = host.querySelector('.ct-go.dis'); if (go) go.onclick = e => { e.preventDefault(); toast('יש להסיר מוצרים שאזלו מהמלאי'); };
  if (!cp || qt) shipNudge(left, after, sub, items, disc);
}
/* close to free shipping: one popup per visit with products that close the gap */
const NUDGE_MAX = 100;
function shipNudge(left, after, sub, items, disc) {
  if (!(SHIP.free_over > 0) || !(left > 0) || left > NUDGE_MAX || document.getElementById('sn')) return;
  try { if (sessionStorage.getItem('ps_ship_nudge')) return; sessionStorage.setItem('ps_ship_nudge', '1'); } catch (e) { /* show anyway */ }
  const ratio = sub > 0 ? after / sub : 1;
  const pool = PRODUCTS.filter(x => !x.out && !items.some(i => i.id === x.id));
  let sugg = pool.filter(x => x.price * ratio >= left).sort((a, b) => a.price - b.price).slice(0, 3);
  if (!sugg.length) sugg = pool.sort((a, b) => b.price - a.price).slice(0, 3);
  const box = document.createElement('div');
  box.id = 'sn'; box.className = 'sn-back';
  box.innerHTML = `<div class="sn-box" role="dialog" aria-modal="true" aria-labelledby="sn-t">
    <button type="button" class="sn-x" aria-label="סגירה">✕</button>
    <div class="sn-i" aria-hidden="true">🚚</div>
    <h2 id="sn-t">רק עוד ${money(left)} ומקבלים משלוח חינם</h2>
    <p>המשלוח עולה ${money(SHIP.fee)}. מוסיפים מוצר וחוסכים אותו${disc ? ' (הסכום נספר אחרי ההנחה)' : ''}.</p>
    ${sugg.length ? `<div class="sn-grid">${sugg.map(card).join('')}</div>` : ''}
    <div class="sn-act"><a class="btn btn-primary" href="products">לבחירת מוצרים</a><button type="button" class="sn-skip">להמשיך בלי</button></div></div>`;
  document.body.appendChild(box);
  const close = () => { box.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  box.addEventListener('click', e => {
    if (e.target === box || e.target.closest('.sn-x, .sn-skip')) return close();
    if (e.target.closest('[data-add]')) setTimeout(() => { close(); draw(); }, 0);
  });
  const x = box.querySelector('.sn-x'); if (x) x.focus();
}
draw(); window.__rerender = draw; if (window.__liveReady) draw();
/* qty buttons are handled by the shared click handler in app.js; redraw after it runs */
document.addEventListener('click', e => { if (e.target.closest('[data-q]')) setTimeout(draw, 0); });
</script>
</body>
</html>
