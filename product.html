<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מוצר — פרוטאין סטוק</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="img/protein-stock-sports-nutrition-e-commerce-logo.webp">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="main"><div class="wrap" id="pp"></div>
<section class="sec-soft"><div class="wrap"><div class="sec-head"><h2>אולי יעניין אותך גם</h2></div><div class="grid" id="rel"></div></div></section></main>
<script src="js/data.js"></script>
<script src="js/catalog.js"></script>
<script src="js/app.js"></script>
<script>
layout('products');
const PID=new URLSearchParams(location.search).get('id');
const host=document.getElementById('pp');
function draw(){
const p=byId(PID);
const relSec=document.querySelector('section');
if(!p){ host.innerHTML='<div class="empty"><h1>המוצר לא נמצא</h1><p style="margin:12px 0 22px">ייתכן שהמוצר הוסר מהקטלוג.</p><a class="btn btn-dark" href="products">לכל המוצרים</a></div>'; if(relSec) relSec.hidden=true; }
else{
  if(relSec) relSec.hidden=false;
  document.title=p.name+' — פרוטאין סטוק';
  const unit=(p.title.match(/(\d+)\s*יחידות/)||[])[1];
  const specs=[];
  if(p.protein) specs.push([p.protein+' גרם','חלבון']);
  const w=p.title.match(/\|\s*(\d+(?:\.\d+)?)\s*(גרם|מ"ל)\s*(?=\|)/); if(w) specs.push([w[1]+' '+w[2],'משקל / נפח ליחידה']);
  if(unit) specs.push([unit,'יחידות במארז']);
  if(p.brand) specs.push([p.brand,'מותג']);
  const q=1; let qty=1;
  host.innerHTML=`<div class="crumbs" style="padding-top:24px"><a href="/">בית</a> / <a href="products">מוצרים</a> / <a href="products?cat=${p.cat}">${catName(p.cat)}</a></div>
  <div class="pp"><div class="pp-img"><img src="${p.img}" alt="${esc(p.name)}" width="800" height="800"></div>
  <div><span class="pbrand">${esc(p.brand)}</span><h1>${esc(p.name)}</h1>
  <div class="ptags" style="position:static;flex-direction:row;flex-wrap:wrap;margin-bottom:12px">${p.sale?`<span class="tag sale">${p.pct}%- הנחה</span>`:''}${p.tags.map(t=>`<span class="tag green">${esc(t)}</span>`).join('')}</div>
  <div class="price">${money(p.price)}${p.sale?`<s>${money(p.old)}</s>`:''}</div><p class="vat">המחיר כולל מע"מ</p>
  ${p.out?'<div class="stock-out">המוצר אזל מהמלאי כרגע. <a href="contact" style="text-decoration:underline">צרו קשר ונעדכן כשיחזור</a></div>':''}
  <div class="specs">${specs.map(s=>`<div class="spec"><b>${esc(s[0])}</b><span>${s[1]}</span></div>`).join('')}</div>
  <div class="buy"><div class="qty"><button id="m" aria-label="הפחת">−</button><span id="n">1</span><button id="pl" aria-label="הוסף">+</button></div>
  <button class="btn btn-primary" id="buy" ${p.out?'disabled':''} style="flex:1;min-width:200px">הוספה לעגלה</button></div>
  <ul class="perks"><li>משלוחים לכל הארץ — חינם מעל ${money(SITE.freeShip)}</li><li>מותג מקורי, טריות מובטחת</li><li>מידע על כשרות מופיע על האריזה</li></ul>
  <div class="desc"><h2>פרטי המוצר</h2><p>${esc(p.title.replace(/\s*\|\s*/g,' · '))}</p>${p.desc?`<p style="margin-top:10px;white-space:pre-line">${esc(p.desc)}</p>`:'}</div></div></div>`;
  document.getElementById('m').onclick=()=>{qty=Math.max(1,qty-1);n.textContent=qty;};
  document.getElementById('pl').onclick=()=>{qty=Math.min(20,qty+1);n.textContent=qty;};
  document.getElementById('buy').onclick=()=>{Cart.add(p.id,qty);Cart.open();};
  const rel=PRODUCTS.filter(x=>x.cat===p.cat&&x.id!==p.id&&!x.out).slice(0,4);
  document.getElementById('rel').innerHTML=rel.map(card).join('');
  if(relSec) relSec.hidden=!rel.length;
}
}
draw(); window.__rerender=draw; if(window.__liveReady) draw();
</script>
</body>
</html>
