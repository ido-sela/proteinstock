<script>
/* Product specs, parsed from the title ("| 57 גרם | 20 גרם חלבון | 12 יחידות במארז | Brand"). */
function parseSpecs(p){
  const t=p.title;
  const unit=(t.match(/(\d+)\s*(?:יחידות|יח'|חטיפים|חטיפי|פחיות|בקבוקים|שקיות)/)||t.match(/מארז\s*(?:של\s*)?(\d+)/)||[])[1];
  const w=t.match(/(\d+(?:\.\d+)?)\s*(גרם|מ"ל|ק"ג|ליטר)(?!\s*(?:חלבון|סוכר))/);
  const flavor=(t.match(/בטעם\s+([^|–]+)/)||[])[1];
  const fl=flavor?flavor.split(/\s+-\s+|\s+(?=[A-Z]{2,}\s+[A-Z]{2,})/)[0].trim():'';
  return {unit, weight:w?w[1]+' '+w[2]:'', flavor:fl};
}
function familyKey(p){ const m=p.title.split('|')[0].match(/^(.*?)\s*בטעם\s/); return m?(p.brand+'|'+m[1].replace(/\s+/g,' ').trim().toLowerCase()):''; }
function variantsHtml(p){
  const k=familyKey(p); if(!k) return '';
  const sib=PRODUCTS.filter(x=>familyKey(x)===k);
  if(sib.length<2) return '';
  return `<div class="variants"><span class="vlabel">בחירת טעם:</span><div class="vlist">${sib.map(x=>`<a href="${purl(x.id)}" class="vopt${x.id===p.id?' on':''}${x.out?' out':''}" ${x.id===p.id?'aria-current="true"':''}>${esc(flavorShort(x))}${x.out?' (אזל)':''}</a>`).join('')}</div></div>`;
}
/* Mixed packs (old site: "הרכב המארז"): for oat porridge the customer can split the 12 units between flavors.
   Same product id and price; the chosen mix is saved on the cart line and sent with the order notes. */
function flavorShort(x){ return (parseSpecs(x).flavor||x.name).split(/\s+—\s+/)[0].replace(/\s*\([^)]*\)/g,'').replace(/\s+עם\s.*$/,'').trim(); }
function packOptions(p){
  if(!/^דייסת/.test(p.title)) return [];
  const k=familyKey(p); const sib=PRODUCTS.filter(x=>familyKey(x)===k&&x.price===p.price);
  if(sib.length<2) return [];
  const me=flavorShort(p), others=sib.filter(x=>x.id!==p.id).map(flavorShort);
  const opts=['12 '+me, ...others.map(o=>`8 ${me} + 4 ${o}`)];
  if(others.length===2) opts.push(`4 מכל טעם (4 ${me}, 4 ${others[0]}, 4 ${others[1]})`);
  return opts;
}
function packHtml(p){
  const o=packOptions(p); if(!o.length) return '';
  return `<div class="variants"><span class="vlabel">הרכב המארז: <b id="pack-cur">${esc(o[0])}</b></span><div class="vlist" id="pack">${o.map((x,i)=>`<button type="button" class="vopt${i?'':' on'}" data-pack="${i}">${esc(x)}</button>`).join('')}</div></div>`;
}
function sugarOf(p){ if(p.sugar!=null) return p.sugar; const i=infoOf(p.id); return i&&i.n&&i.n.sugar!=null?i.n.sugar:null; }
function benefits(p){
  const i=infoOf(p.id); if(!i) return [];
  const n=i.n||{}, s=parseSpecs(p);
  const unit=(i.per||'').replace(/^ל/,'').replace(/\s*\(.*$/,'');   // "חטיף", "בקבוק", "פחית"...
  const out=[];
  if(n.protein) out.push(`${n.protein} גרם חלבון ${unit?'בכל '+unit:''}`.trim());
  if(n.creatine) out.push(`${n.creatine} גרם קריאטין מונוהידראט בכל מנה`);
  if(n.sugar!=null&&n.sugar>0&&n.sugar<=5) out.push(`דל סוכר – רק ${n.sugar} גרם סוכר ${unit?'ל'+unit:''}`.trim());
  if(n.kcal&&n.kcal<=260&&!/פחית/.test(unit)) out.push(`${n.kcal} קלוריות בלבד ${unit?'ל'+unit:''}`.trim());
  if(n.fiber&&n.fiber>=4) out.push(`${n.fiber} גרם סיבים תזונתיים – לתחושת שובע`);
  if(n.caf) out.push(`${n.caf} מ״ג קפאין בפחית`);
  (i.ben||[]).forEach(b=>out.push(b));
  if(s.unit&&!n.creatine) out.push(`מארז ${s.unit} יחידות – נוח לעבודה, לאימון או לטיול`);
  return out;
}
function infoHtml(p){
  const i=infoOf(p.id); if(!i) return '';
  const fmt=v=>String(v);
  const rows=i.n?NUT_ROWS.filter(r=>i.n[r[0]]!=null).map(r=>`<tr><th>${r[1]}</th><td>${fmt(i.n[r[0]])} ${r[2]}</td></tr>`).join(''):'';
  let h='';
  const b=benefits(p);
  if(b.length) h+=`<h3 class="info-h">היתרונות המרכזיים</h3><ul class="ben">${b.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  if(rows) h+=`<h3 class="info-h">ערכים תזונתיים (${esc((i.per||'').replace(/^ל/,'למנה – ').replace(/[()]/g,''))})</h3><table class="spec-t"><tbody>${rows}</tbody></table>`;
  if(i.contains&&i.contains.length) h+=`<h3 class="info-h">אלרגנים</h3><p><b>מכיל:</b> ${i.contains.join(', ')}</p>`;
  else if(i.contains) h+=`<h3 class="info-h">אלרגנים</h3><p>ללא אלרגנים מוצהרים.</p>`;
  if(i.may&&i.may.length) h+=`<p><b>עלול להכיל:</b> ${i.may.join(', ')}</p>`;
  if(i.ingr) h+=`<h3 class="info-h">רכיבים</h3><p>${esc(i.ingr)}</p>`;
  if(i.warn&&i.warn.length) h+=`<div class="warn-box">${i.warn.map(w=>`<p>⚠️ ${esc(w)}</p>`).join('')}</div>`;
  if(i.note) h+=`<p class="info-note">${esc(i.note)}</p>`;
  return `<div class="info">${h}</div>`;
}
function productSpecs(p){
  const s=parseSpecs(p), out=[];
  if(p.protein) out.push([p.protein+' גרם','חלבון ליחידה']);
  { const sg=sugarOf(p); if(sg!=null) out.push([sg+' גרם','סוכר ליחידה']); }
  { const i=infoOf(p.id); if(i&&i.n&&i.n.kcal) out.push([i.n.kcal+' קק״ל','קלוריות ליחידה']); }
  if(s.weight) out.push([s.weight,'משקל / נפח ליחידה']);
  if(s.unit) out.push([s.unit,'יחידות במארז']);
  if(p.brand) out.push([p.brand,'מותג']);
  return out;
}
function productDetails(p){
  const s=parseSpecs(p), out=[['שם המוצר',p.name]];
  if(p.brand) out.push(['מותג',p.brand]);
  if(catName(p.cat)) out.push(['קטגוריה',catName(p.cat)]);
  if(s.flavor) out.push(['טעם',s.flavor]);
  if(s.weight) out.push(['משקל / נפח ליחידה',s.weight]);
  if(s.unit) out.push(['יחידות במארז',s.unit]);
  if(p.protein) out.push(['חלבון ליחידה',p.protein+' גרם']);
  { const sg=sugarOf(p); if(sg!=null) out.push(['סוכר ליחידה',sg+' גרם']); }
  if(p.tags.length) out.push(['מאפיינים',p.tags.join(', ')]);
  return out;
}
</script>
<script>
layout('products');
const QS=new URLSearchParams(location.search);
let PID=QS.get('id')||window.PS_PID||null;
function bySlug(slug){   // old site links: /product/<product-name-with-dashes>
  const norm=t=>t.toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
  const w=norm(decodeURIComponent(slug)).split(' ').filter(Boolean); if(!w.length) return null;
  let best=null,score=0;
  for(const x of PRODUCTS){ const t=' '+norm(x.title)+' '; const sc=w.filter(q=>t.includes(' '+q+' ')).length/w.length; if(sc>score){score=sc;best=x;} }
  return score>=0.6?best:null;
}
const host=document.getElementById('pp');
let giveUp=false; setTimeout(()=>{ giveUp=true; if(!byId(PID)) draw(); },4000);
function draw(){
if(!PID&&QS.get('slug')){ const m=bySlug(QS.get('slug')); if(m){ PID=m.id; history.replaceState(null,'',purl(m.id)); } }
const p=byId(PID);
const relSec=document.querySelector('section');
if(!p&&!window.__liveReady&&!giveUp){ host.innerHTML='<div class="empty"><p style="padding:60px 0">טוען מוצר…</p></div>'; if(relSec) relSec.hidden=true; return; }
if(!p){ host.innerHTML='<div class="empty"><h1>המוצר לא נמצא</h1><p style="margin:12px 0 22px">ייתכן שהמוצר הוסר מהקטלוג.</p><a class="btn btn-dark" href="products">לכל המוצרים</a></div>'; if(relSec) relSec.hidden=true; }
else{
  if(relSec) relSec.hidden=false;
  document.title=p.name+' — פרוטאין סטוק';
  const specs=productSpecs(p);
  const q=1; let qty=1;
  host.innerHTML=`<div class="crumbs" style="padding-top:24px"><a href="/">בית</a> / <a href="products">מוצרים</a> / <a href="products?cat=${p.cat}">${catName(p.cat)}</a></div>
  <div class="pp"><div class="pp-img"><img src="${p.img}" alt="${esc(p.name)}" width="800" height="800"></div>
  <div><span class="pbrand">${esc(p.brand)}</span><h1>${esc(p.name)}</h1>
  <div class="ptags" style="position:static;flex-direction:row;flex-wrap:wrap;margin-bottom:12px">${p.sale?`<span class="tag sale">${p.pct}%- הנחה</span>`:''}${p.tags.map(t=>`<span class="tag green">${esc(t)}</span>`).join('')}</div>
  <div class="price">${money(p.price)}${p.sale?`<s>${money(p.old)}</s>`:''}</div><p class="vat">המחיר כולל מע"מ</p>
  ${p.out?'<div class="stock-out">המוצר אזל מהמלאי כרגע. <a href="contact" style="text-decoration:underline">צרו קשר ונעדכן כשיחזור</a></div>':''}
  ${variantsHtml(p)}${packHtml(p)}
  <div class="specs">${specs.map(s=>`<div class="spec"><b>${esc(s[0])}</b><span>${s[1]}</span></div>`).join('')}</div>
  <div class="buy"><div class="qty"><button id="m" aria-label="הפחת">−</button><span id="n">1</span><button id="pl" aria-label="הוסף">+</button></div>
  <button class="btn btn-primary" id="buy" ${p.out?'disabled':''} style="flex:1;min-width:200px">הוספה לעגלה</button></div>
  <ul class="perks"><li>משלוחים לכל הארץ — חינם מעל ${money(SITE.freeShip)}</li><li>מותג מקורי, טריות מובטחת</li><li>מידע על כשרות מופיע על האריזה</li></ul>
  <div class="desc"><h2>פרטי המוצר</h2>${infoHtml(p)}<h3 class="info-h">מפרט</h3><table class="spec-t"><tbody>${productDetails(p).map(r=>`<tr><th>${r[0]}</th><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table>${p.desc?`<p style="margin-top:10px;white-space:pre-line">${esc(p.desc)}</p>`:''}<div class="note-box"><h3>חשוב לדעת</h3><ul><li>התמונה להמחשה בלבד. עיצוב האריזה עשוי להשתנות בין סדרות ייצור.</li></ul><p class="disc">*המידע המופיע באתר בנוגע למרכיבי המוצר וערכיו התזונתיים נמסר לנוחותכם בלבד. ייתכנו טעויות, אי-התאמות או שינויים בעקבות עדכוני יצרן, והנתונים המחייבים הם אלה המופיעים על גבי אריזת המוצר. יש לקרוא את התווית לפני השימוש, במיוחד במקרה של רגישות או אלרגיה.</p></div></div></div></div>`;
  document.getElementById('m').onclick=()=>{qty=Math.max(1,qty-1);n.textContent=qty;};
  document.getElementById('pl').onclick=()=>{qty=Math.min(20,qty+1);n.textContent=qty;};
  const packs=packOptions(p); let pack=0;
  const pk=document.getElementById('pack'); if(pk) pk.onclick=e=>{ const b=e.target.closest('[data-pack]'); if(!b) return; pack=+b.dataset.pack; pk.querySelectorAll('.vopt').forEach(x=>x.classList.toggle('on',x===b)); document.getElementById('pack-cur').textContent=packs[pack]; };
  document.getElementById('buy').onclick=()=>{Cart.add(p.id,qty,pack?packs[pack]:'');Cart.open();};
  const rel=PRODUCTS.filter(x=>x.cat===p.cat&&x.id!==p.id&&!x.out).slice(0,4);
  document.getElementById('rel').innerHTML=rel.map(card).join('');
  if(relSec) relSec.hidden=!rel.length;
}
}
draw(); window.__rerender=draw; if(window.__liveReady) draw();
</script>
