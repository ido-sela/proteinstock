/* Product specs, parsed from the title ("| 57 גרם | 20 גרם חלבון | 12 יחידות במארז | Brand"). */
function parseSpecs(p){
  const t=p.title;
  const unit=(t.match(/(\d+)\s*(?:יחידות|יח'|חטיפים|חטיפי|פחיות|בקבוקים|שקיות)/)||t.match(/מארז\s*(?:של\s*)?(\d+)/)||[])[1];
  const w=t.match(/(\d+(?:\.\d+)?)\s*(גרם|מ"ל|ק"ג|ליטר)(?!\s*(?:חלבון|סוכר))/);
  const flavor=(t.match(/בטעם\s+([^|–]+)/)||[])[1];
  const fl=flavor?flavor.split(/\s+-\s+|\s+(?=[A-Z]{2,}\s+[A-Z]{2,})/)[0].trim():'';
  return {unit, weight:w?w[1]+' '+w[2]:'', flavor:fl};
}
function familyKey(p){ const m=p.title.split('|')[0].match(/^(.*?)\s*בטעם\s/); return m?(p.brand+'|'+m[1].replace(/\s+/g,' ').trim().toLowerCase()):''; }
function variantsHtml(p){
  const k=familyKey(p); if(!k) return '';
  const sib=PRODUCTS.filter(x=>familyKey(x)===k);
  if(sib.length<2) return '';
  return `<div class="variants"><span class="vlabel">בחירת טעם:</span><div class="vlist">${sib.map(x=>`<a href="${purl(x.id)}" class="vopt${x.id===p.id?' on':''}${x.out?' out':''}" ${x.id===p.id?'aria-current="true"':''}>${esc(flavorShort(x))}${x.out?' (אזל)':''}</a>`).join('')}</div></div>`;
}
/* Mixed packs (old site: "הרכב המארז"): for oat porridge the customer can split the 12 units between flavors.
   Same product id and price; the chosen mix is saved on the cart line and sent with the order notes. */
function flavorShort(x){ return (parseSpecs(x).flavor||x.name).split(/\s+—\s+/)[0].replace(/\s*\([^)]*\)/g,'').replace(/\s+עם\s.*$/,'').trim(); }
function packOptions(p){
  if(!/^דייסת/.test(p.title)) return [];
  const k=familyKey(p); const sib=PRODUCTS.filter(x=>familyKey(x)===k&&x.price===p.price);
  if(sib.length<2) return [];
  const me=flavorShort(p), others=sib.filter(x=>x.id!==p.id).map(flavorShort);
  const opts=['12 '+me, ...others.map(o=>`8 ${me} + 4 ${o}`)];
  if(others.length===2) opts.push(`4 מכל טעם (4 ${me}, 4 ${others[0]}, 4 ${others[1]})`);

}

function sugarOf(p){ if(p.sugar!=null) return p.sugar; const i=infoOf(p.id); return i&&i.n&&i.n.sugar!=null?i.n.sugar:null; }
function benefits(p){

}
/* The product's own description (from the store, as it was on the old site): ingredients, allergens, kashrut, warnings.

  const flush=()=>{ if(list.length){ h+=`<ul class="ben">${list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`; list=[]; } };
  for(const l of lines){
    if(/^[✔✓•-]\s*/.test(l)){ list.push(l.replace(/^[✔✓•-]\s*/,'')); continue; }
    flush();
    const m=l.match(lab);
    if(m) h+=`<p class="d-line${/אזהר|משלשל/.test(l)?' warn':''}"><b>${esc(m[0])}</b>${esc(l.slice(m[0].length))}</p>`;

}

function infoHtml(p){

  if(i.contains&&i.contains.length) h+=`<h3 class="info-h">אלרגנים</h3><p><b>מכיל:</b> ${i.contains.join(', ')}</p>`;
  else if(i.contains) h+=`<h3 class="info-h">אלרגנים</h3><p>ללא אלרגנים מוצהרים.</p>`;
  if(i.may&&i.may.length) h+=`<p><b>עלול להכיל:</b> ${i.may.join(', ')}</p>`;
  if(i.ingr) h+=`<h3 class="info-h">רכיבים</h3><p>${esc(i.ingr)}</p>`;
  if(i.warn&&i.warn.length) h+=`<div class="warn-box">${i.warn.map(w=>`<p>⚠️ ${esc(w)}</p>`).join('')}</div>`;
  if(i.note) h+=`<p class="info-note">${esc(i.note)}</p>`;
  return `<div class="info">${h}</div>`;
}
function productSpecs(p){
  const s=parseSpecs(p), out=[];
  if(p.protein) out.push([p.protein+' גרם','חלבון ליחידה']);
  { const sg=sugarOf(p); if(sg!=null) out.push([sg+' גרם','סוכר ליחידה']); }
  { const i=infoOf(p.id); if(i&&i.n&&i.n.kcal) out.push([i.n.kcal+' קק״ל','קלוריות ליחידה']); }
  if(s.weight) out.push([s.weight,'משקל / נפח ליחידה']);
  if(s.unit) out.push([s.unit,'יחידות במארז']);
  if(p.brand) out.push([p.brand,'מותג']);
  return out;
}
function productDetails(p){
  const s=parseSpecs(p), out=[['שם המוצר',p.name]];
  if(p.brand) out.push(['מותג',p.brand]);
  if(catName(p.cat)) out.push(['קטגוריה',catName(p.cat)]);
  if(s.flavor) out.push(['טעם',s.flavor]);
  if(s.weight) out.push(['משקל / נפח ליחידה',s.weight]);
  if(s.unit) out.push(['יחידות במארז',s.unit]);
  if(p.protein) out.push(['חלבון ליחידה',p.protein+' גרם']);
  { const sg=sugarOf(p); if(sg!=null) out.push(['סוכר ליחידה',sg+' גרם']); }
  if(p.tags.length) out.push(['מאפיינים',p.tags.join(', ')]);
  return out;
}

  // מוצר שאזל: הרשמה לעדכון כשיחזור (נשמר במערכת המכירות של פרוטאין סטוק)
  const soa=document.getElementById('soa-f');
  if(soa) soa.onsubmit=async e=>{
    e.preventDefault();
    const c=document.getElementById('soa-c').value.trim(), m=document.getElementById('soa-m'), b=document.getElementById('soa-b');
    const okMail=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c), okPhone=c.replace(/\D/g,'').length>=9&&/^[0-9+\-\s()]+$/.test(c);
    if(!okMail&&!okPhone){m.textContent='נא להזין טלפון נייד או כתובת אימייל תקינה';return;}
    if(!document.getElementById('soa-ok').checked){m.textContent='נא לאשר קבלת עדכון';return;}
    b.disabled=true;m.textContent='שולחים…';
    try{
      const r=await fetch('https://sales.proteinstock.co.il/api/public/stock-alert',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({product_id:p.id,title:p.name,contact:c,url:location.href.split('?')[0],hp:document.getElementById('soa-hp').value})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||'');
      soa.remove();m.textContent='✓ נרשמתם! נעדכן אתכם ברגע שהמוצר יחזור למלאי.';
    }catch(x){b.disabled=false;m.textContent=x.message||'לא הצלחנו לרשום כרגע. אפשר לפנות אלינו בוואטסאפ.';}
  };
  galInit(host);
  const rel=PRODUCTS.filter(x=>x.cat===p.cat&&x.id!==p.id&&!x.out).slice(0,4);
  document.getElementById('rel').innerHTML=rel.map(card).join('');
  if(relSec) relSec.hidden=!rel.length;
}
}
/* product photos: a swipeable strip (one photo per slide); thumbnails below follow the swipe and jump to a photo */
function galHtml(p){
  const imgs=(p.imgs&&p.imgs.length?p.imgs:[p.img]);
  const many=imgs.length>1;
  return `<div class="pp-img${many?' many':''}"><div class="pp-track" tabindex="0" aria-label="תמונות המוצר">${imgs.map((u,i)=>`<div class="pp-slide"><img ${i?'':'id="pp-main" '}src="${esc(u)}" alt="${i?'':esc(p.name)}" width="800" height="800" ${i?'loading="lazy"':'fetchpriority="high"'} draggable="false"></div>`).join('')}</div>${many?`<button type="button" class="pp-nav prev" aria-label="התמונה הקודמת">‹</button><button type="button" class="pp-nav next" aria-label="התמונה הבאה">›</button><span class="pp-count" aria-hidden="true">1 / ${imgs.length}</span>`:''}</div>${many?`<div class="pp-thumbs" role="list">${imgs.map((u,i)=>`<button type="button" class="pp-th${i?'':' on'}" data-i="${i}" aria-label="תמונה ${i+1} מתוך ${imgs.length}" role="listitem"><img src="${esc(u)}" alt="" loading="lazy" width="120" height="120"></button>`).join('')}</div>`:''}`;
}
function galInit(host){
  const tr=host.querySelector('.pp-track'); if(!tr) return;
  const slides=[...tr.children], th=host.querySelector('.pp-thumbs'), cnt=host.querySelector('.pp-count');
  if(slides.length<2) return;
  let cur=0;
  const mark=i=>{ cur=i; if(cnt) cnt.textContent=(i+1)+' / '+slides.length;
    if(th){ th.querySelectorAll('.pp-th').forEach((b,k)=>b.classList.toggle('on',k===i)); const b=th.children[i]; if(b){ const r=b.getBoundingClientRect(), R=th.getBoundingClientRect(); th.scrollBy({left:(r.left+r.width/2)-(R.left+R.width/2),behavior:'smooth'}); } } };
  const go=i=>{ i=(i+slides.length)%slides.length; tr.scrollBy({left:slides[i].getBoundingClientRect().left-tr.getBoundingClientRect().left,behavior:'smooth'}); mark(i); };
  /* which slide is in view (works for swipes, trackpads and RTL alike) */
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting&&e.intersectionRatio>.6) mark(slides.indexOf(e.target)); }),{root:tr,threshold:[.6]});
  slides.forEach(sl=>io.observe(sl));
  if(th) th.onclick=e=>{ const b=e.target.closest('.pp-th'); if(b) go(+b.dataset.i); };
  host.querySelector('.pp-nav.prev').onclick=()=>go(cur-1);
  host.querySelector('.pp-nav.next').onclick=()=>go(cur+1);
  tr.onkeydown=e=>{ if(e.key==='ArrowLeft'){ e.preventDefault(); go(cur+1); } else if(e.key==='ArrowRight'){ e.preventDefault(); go(cur-1); } };
}

draw(); window.__rerender=draw; if(window.__liveReady) draw();
