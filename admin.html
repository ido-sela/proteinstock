<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ניהול — פרוטאין סטוק</title>
<link rel="icon" href="img/protein-stock-sports-nutrition-e-commerce-logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#0f1b33;--mute:#5a6782;--line:#dde3ee;--navy:#0f2a5c;--blue:#1d4ed8;--blue-ink:#fff;--ok:#0f7a3d;--okbg:#e3f5ea;--warn:#8a5a00;--warnbg:#fff3d6;--bad:#b42318;--badbg:#fde8e6;--chip:#e8edf7;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0c1220;--card:#141c2f;--ink:#e8edf8;--mute:#9aa7c2;--line:#26324d;--navy:#0a1428;--blue:#6b95ff;--blue-ink:#0a1428;--ok:#5ad08b;--okbg:#10301f;--warn:#f1c35a;--warnbg:#33290e;--bad:#ff8b80;--badbg:#3a1613;--chip:#1d2842;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Heebo,system-ui,sans-serif;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;line-height:1.25}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1080px;margin-inline:auto;padding-block:20px 60px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.bar img{height:34px;width:auto}
.bar .sp{flex:1}
.who{color:var(--mute);font-size:.88rem;word-break:break-all}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 16px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--blue-ink);font-weight:700}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{padding:6px 12px;font-size:.88rem}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 16px;cursor:pointer;font-weight:500;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--blue);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.login{max-width:420px;margin:12vh auto 0;text-align:center}
.login img{height:44px;margin-bottom:14px}
.login h1{font-size:1.4rem;margin-bottom:6px}
.login p{color:var(--mute);margin:0 0 16px}
input[type=email],input[type=text],input[type=number],input[type=search],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
input:focus,select:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.msg{margin-top:12px;padding:10px 12px;border-radius:9px;font-size:.92rem;text-align:start}
.msg.ok{background:var(--okbg);color:var(--ok)}.msg.err{background:var(--badbg);color:var(--bad)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:99px;padding:5px 14px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--blue);color:var(--blue-ink);border-color:var(--blue);font-weight:700}
.ord{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.ord summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 14px;align-items:center;padding:13px 16px}
.ord summary::-webkit-details-marker{display:none}
.ord .num{font-weight:800;letter-spacing:.02em}
.ord .sub{color:var(--mute);font-size:.88rem}
.ord .tot{font-weight:700}
.badge{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--chip)}
.badge.paid{background:var(--okbg);color:var(--ok)}.badge.pending{background:var(--warnbg);color:var(--warn)}.badge.failed,.badge.cancelled,.badge.refunded{background:var(--badbg);color:var(--bad)}
.ord .body{border-top:1px solid var(--line);padding:14px 16px;display:grid;gap:12px}
.ord table{width:100%;border-collapse:collapse;font-size:.92rem}
.ord td{padding:5px 0;border-bottom:1px dashed var(--line)}
.ord td:last-child{text-align:end;white-space:nowrap}
.kv{display:flex;gap:10px 22px;flex-wrap:wrap;font-size:.92rem}
.kv span{color:var(--mute)}
.row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row2 select{width:auto;min-width:150px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tools input{max-width:340px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 92px 92px auto auto auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .nm{font-weight:500;overflow-wrap:anywhere}
.prow label{display:flex;gap:6px;align-items:center;font-size:.88rem;white-space:nowrap}
.prow.dirty{background:var(--warnbg)}
.plist{padding:0;overflow:hidden}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;max-width:560px}
.field label{display:block;font-size:.88rem;color:var(--mute);margin-bottom:4px}
.empty{color:var(--mute);text-align:center;padding:30px}
.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.92rem;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding-bottom:70px}
.pc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pc.dirty{border-color:var(--warn);box-shadow:0 0 0 2px var(--warnbg)}
.pc.is-hidden .pimg img{opacity:.45}
.pc .sel{position:absolute;top:14px;inset-inline-start:14px;z-index:2;background:var(--card);border-radius:6px;padding:3px 4px;line-height:0;border:1px solid var(--line)}
.pc .sel input{width:18px;height:18px;margin:0;cursor:pointer}
.pimg{position:relative;border:0;padding:0;background:#fff;border-radius:9px;cursor:zoom-in;aspect-ratio:1;overflow:hidden;display:block;width:100%}
.pimg img{width:100%;height:100%;object-fit:contain;display:block}
.tg{position:absolute;bottom:6px;inset-inline-end:6px;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--ink)}
.tg.out{background:var(--badbg);color:var(--bad)}.tg.hid{background:var(--ink);color:var(--bg);inset-inline-end:auto;inset-inline-start:6px}.tg.sale{background:var(--okbg);color:var(--ok);bottom:30px}
.pc .pn{font-size:.88rem;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pf label{font-size:.76rem;color:var(--mute);display:block}.pf input{padding:6px 8px;margin-top:2px}
.pt{display:flex;gap:12px;flex-wrap:wrap}.pt label{display:flex;gap:5px;align-items:center;font-size:.86rem}
.bulk{position:fixed;inset-inline:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:max-content;max-width:calc(100vw - 24px);background:var(--card);border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.25);border-radius:14px;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;z-index:20}
.bulk[hidden]{display:none}
.bulk .pct{display:flex;gap:6px}.bulk .pct input{width:74px;padding:6px 8px}
.lb{position:fixed;inset:0;background:rgba(5,10,25,.82);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;cursor:zoom-out}
.lb[hidden]{display:none}
.lb img{max-width:min(92vw,720px);max-height:76vh;background:#fff;border-radius:12px;object-fit:contain}
.lb p{color:#fff;max-width:640px;text-align:center;margin:0;font-size:.95rem}
.lb-x{position:absolute;top:16px;inset-inline-end:16px;background:#fff;border:0;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:1rem;color:#111}
.ai{display:flex;flex-direction:column;gap:14px}
.chat{min-height:240px;max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
.m{max-width:86%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.user{align-self:flex-start;background:var(--blue);color:var(--blue-ink);border-end-start-radius:4px}
.m.assistant{align-self:flex-end;background:var(--chip);border-end-end-radius:4px}
.m.err{background:var(--badbg);color:var(--bad)}
.act{display:block;margin-top:6px;font-size:.82rem;color:var(--ok);font-weight:700}
textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);resize:vertical}
textarea:focus{outline:2px solid var(--blue);outline-offset:2px}
@media (max-width:760px){
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .m{max-width:94%}
}
@media (max-width:760px){
  .ord summary{grid-template-columns:1fr auto}
  .ord summary .sub{grid-column:1/-1}
  .prow{grid-template-columns:1fr 1fr;}
  .prow .nm{grid-column:1/-1}
}
</style>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/data.js"></script>
<script src="js/catalog.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/admin-products.js"></script>
<script>
const SB_URL = 'https://yplzliqpohqehypllxdq.supabase.co';
const SB_KEY = 'sb_publishable_Gcr_7r00CovbMZj-tJin8g_Jp8B1JcB';
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '₪' + (Math.round(Number(n) * 100) / 100).toLocaleString('he-IL');
const when = d => new Date(d).toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' });
const STATUS = { pending: 'ממתינה לתשלום', paid: 'שולמה', failed: 'נכשלה', cancelled: 'בוטלה', refunded: 'הוחזרה' };
let toastT;
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

/* ---------- login ---------- */
function showLogin(note) {
  document.body.classList.remove('sh'); app.className = 'wrap';
  app.innerHTML = `<div class="login card">
    <img src="img/protein-stock-sports-nutrition-e-commerce-logo.webp" alt="פרוטאין סטוק">
    <h1>כניסה לניהול</h1><p>נשלח אליך קישור כניסה למייל. אין סיסמה.</p>
    <form id="lf"><input type="email" id="em" placeholder="האימייל שלך" autocomplete="email" required dir="ltr" style="text-align:start">
    <button class="btn pri" style="width:100%;margin-top:10px" id="lb">שלחו לי קישור כניסה</button></form>
    <div id="lm"></div>${note ? `<div class="msg err">${esc(note)}</div>` : ''}</div>`;
  document.getElementById('lf').onsubmit = async e => {
    e.preventDefault();
    const b = document.getElementById('lb'), m = document.getElementById('lm'); b.disabled = true;
    const { error } = await sb.auth.signInWithOtp({ email: document.getElementById('em').value.trim(), options: { emailRedirectTo: location.origin + '/admin' } });
    b.disabled = false;
    m.innerHTML = error
      ? `<div class="msg err">לא הצלחנו לשלוח את הקישור: ${esc(error.message)}</div>`
      : '<div class="msg ok">הקישור נשלח. פתחו אותו באותו מכשיר ובאותו דפדפן. אם לא הגיע, בדקו בספאם.</div>';
  };
}

/* ---------- shell ---------- */
const ICO = {
  orders: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.5l1-3h11l1 3"/><path d="M3.5 6.5v10h13v-10"/><path d="M7.5 10h5"/></svg>',
  products: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 2.8H16a1.2 1.2 0 0 1 1.2 1.2v5.4a1.2 1.2 0 0 1-.35.85l-6.9 6.9a1.2 1.2 0 0 1-1.7 0L3.3 13.75a1.2 1.2 0 0 1 0-1.7l6.9-6.9a1.2 1.2 0 0 1 .4-.35z"/><circle cx="13.3" cy="6.7" r="1"/></svg>',
  ai: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5l1.7 4.3 4.3 1.7-4.3 1.7L10 14.5l-1.7-4.3L4 8.5l4.3-1.7z"/><path d="M15.5 13l.6 1.5 1.5.6-1.5.6-.6 1.5-.6-1.5-1.5-.6 1.5-.6z"/></svg>',
  settings: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>',
  store: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l1.2-4h11.6L17 8"/><path d="M3 8a2.3 2.3 0 0 0 4.6 0 2.3 2.3 0 0 0 4.8 0A2.3 2.3 0 0 0 17 8"/><path d="M4.5 10.5V16.5h11V10.5"/></svg>',
  search: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="9" r="5.5"/><path d="M13.2 13.2L17 17"/></svg>',
  out: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5H4.5v13H8"/><path d="M12 6.5L15.5 10 12 13.5M15.5 10H8"/></svg>'
};
const NAVI = ICO;
function closeNav() { const n = document.getElementById('nav'), b = document.getElementById('nbd'); if (n) n.classList.remove('open'); if (b) b.classList.remove('open'); }
/* Page header inside the panel: icon + title on the start side, actions on the end side. */
function setBar(key, title, actions) {
  const pb = document.getElementById('pb'), panel = document.getElementById('panel'); if (!pb) return;
  panel.classList.remove('gray'); document.getElementById('pane').classList.remove('wide');
  pb.innerHTML = `<button class="burger" id="burger" aria-label="תפריט">☰</button><span class="pb-i">${ICO[key] || ''}</span><span class="pb-t" id="pb-t">${esc(title)}</span><span class="pb-s"></span><span class="pb-a">${actions || ''}</span>`;
  document.getElementById('burger').onclick = () => { document.getElementById('nav').classList.add('open'); document.getElementById('nbd').classList.add('open'); };
  panel.scrollTop = 0;
}
async function enter(session) {
  const { data, error } = await sb.from('admins').select('email').limit(1);
  app.className = '';
  if (error || !data || !data.length) {
    document.body.classList.remove('sh'); app.className = 'wrap';
    app.innerHTML = `<div class="login card"><h1>אין הרשאה</h1><p>${esc(session.user.email)} אינו ברשימת המנהלים.</p><button class="btn" id="lo">התנתקות</button></div>`;
    document.getElementById('lo').onclick = () => sb.auth.signOut();
    return;
  }
  document.body.classList.add('sh');
  const items = [['ai', 'בנייה עם AI'], ['orders', 'הזמנות'], ['products', 'מוצרים']];
  const mail = session.user.email;
  app.innerHTML = `<div class="sh-body"><aside class="sh-nav" id="nav" aria-label="ניווט">
    <div class="sh-logo"><img src="img/protein-stock-sports-nutrition-e-commerce-logo.webp" alt=""><b>פרוטאין סטוק</b></div>
    <div class="sh-search">${ICO.search}<input id="gs" type="search" placeholder="חיפוש מוצרים" aria-label="חיפוש מוצרים" autocomplete="off"><kbd>Ctrl K</kbd></div>
    ${items.map(([k, v], i) => `<button class="nv" data-t="${k}" aria-selected="${k === 'orders'}">${ICO[k]}${v}</button>`).join('')}
    <div class="lbl">ערוצי מכירה</div>
    <a class="nv" href="/" target="_blank" rel="noopener">${ICO.store}החנות המקוונת</a>
    <div class="grow"></div>
    <button class="nv" data-t="settings" aria-selected="false">${ICO.settings}הגדרות</button>
    <div class="sh-user"><span class="av">${esc((mail[0] || '?').toUpperCase())}</span><span class="em" title="${esc(mail)}">${esc(mail)}</span><button id="lo" aria-label="התנתקות" title="התנתקות">${ICO.out}</button></div>
  </aside><div class="nav-bd" id="nbd"></div>
  <div class="sh-panel" id="panel"><header class="pb" id="pb"></header><main class="sh-main" id="pane"></main>
    <form class="ai-bar" id="aib"><span class="ai-i">${ICO.ai}</span><input id="aib-in" placeholder="בקשו מהעוזר לעשות משהו בחנות…" aria-label="בקשה לעוזר" maxlength="4000"><button aria-label="שליחה">↑</button></form></div></div>`;
  document.getElementById('lo').onclick = () => sb.auth.signOut();
  document.getElementById('nbd').onclick = closeNav;
  const tabs = [...app.querySelectorAll('[data-t]')];
  const go = t => { tabs.forEach(b => b.setAttribute('aria-selected', b.dataset.t === t)); document.getElementById('aib').hidden = t === 'ai'; closeNav(); ({ orders, products, ai, settings }[t])(); };
  tabs.forEach(b => b.onclick = () => go(b.dataset.t));
  document.getElementById('aib').onsubmit = e => { e.preventDefault(); const i = document.getElementById('aib-in'); const v = i.value.trim(); if (!v) return; i.value = ''; window.__pendingAsk = v; go('ai'); };
  const gs = document.getElementById('gs');
  gs.onkeydown = e => { if (e.key === 'Enter') { SP.q = gs.value.trim(); SP.tab = 'all'; SP.page = 0; gs.value = ''; gs.blur(); go('products'); } else if (e.key === 'Escape') { gs.value = ''; gs.blur(); } };
  window.onkeydown = e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); closeNav(); gs.focus(); } };
  go('orders');
}
const pane = () => document.getElementById('pane');

/* ---------- orders ---------- */
async function orders() {
  setBar('orders', 'הזמנות');
  pane().innerHTML = '<p class="empty">טוען הזמנות…</p>';
  const { data, error } = await sb.from('orders')
    .select('id,number,status,customer_name,phone,address,notes,total,shipping,created_at,paid_at,order_items(title,qty,unit_price,line_total)')
    .order('created_at', { ascending: false }).limit(300);
  if (error) { pane().innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  let filter = 'all';
  const draw = () => {
    const counts = { all: data.length }; data.forEach(o => counts[o.status] = (counts[o.status] || 0) + 1);
    const list = data.filter(o => filter === 'all' || o.status === filter);
    pane().innerHTML = `<div class="chips">${['all', ...Object.keys(STATUS)].map(s => `<button class="chip" data-f="${s}" aria-pressed="${s === filter}">${s === 'all' ? 'הכל' : STATUS[s]} (${counts[s] || 0})</button>`).join('')}</div>` +
      (list.length ? list.map(o => `<details class="ord" data-id="${esc(o.id)}"><summary><span class="num" dir="ltr">${esc(o.number)}</span><span>${esc(o.customer_name)}</span><span class="tot">${money(o.total)}</span><span class="badge ${esc(o.status)}">${esc(STATUS[o.status] || o.status)}</span><span class="sub">${when(o.created_at)}</span></summary>
        <div class="body"><table>${(o.order_items || []).map(i => `<tr><td>${esc(i.title)}</td><td>× ${i.qty}</td><td>${money(i.line_total)}</td></tr>`).join('')}${Number(o.shipping) ? `<tr><td>משלוח</td><td></td><td>${money(o.shipping)}</td></tr>` : ''}</table>
        <div class="kv"><div><span>טלפון:</span> <a href="tel:${esc(o.phone)}" dir="ltr">${esc(o.phone)}</a></div><div><a href="https://wa.me/${esc(String(o.phone).replace(/\D/g, '').replace(/^0/, '972'))}" target="_blank" rel="noopener">וואטסאפ</a></div>${o.address ? `<div><span>כתובת:</span> ${esc(o.address)}</div>` : ''}${o.notes ? `<div><span>הערות:</span> ${esc(o.notes)}</div>` : ''}${o.paid_at ? `<div><span>שולם:</span> ${when(o.paid_at)}</div>` : ''}</div>
        <div class="row2"><label for="st-${esc(o.id)}">סטטוס</label><select id="st-${esc(o.id)}" data-st="${esc(o.id)}">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}"${k === o.status ? ' selected' : ''}>${v}</option>`).join('')}</select></div></div></details>`).join('') : '<p class="empty">אין הזמנות להצגה.</p>');
    pane().querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; draw(); });
    pane().querySelectorAll('[data-st]').forEach(s => s.onchange = async () => {
      const o = data.find(x => x.id === s.dataset.st); const prev = o.status; s.disabled = true;
      const { error } = await sb.from('orders').update({ status: s.value }).eq('id', o.id);
      s.disabled = false;
      if (error) { s.value = prev; toast('השמירה נכשלה: ' + error.message); return; }
      o.status = s.value; if (s.value === 'paid' && !o.paid_at) o.paid_at = new Date().toISOString();
      toast('הסטטוס עודכן'); const open = [...pane().querySelectorAll('details[open]')].map(d => d.dataset.id); draw();
      pane().querySelectorAll('details').forEach(d => { if (open.includes(d.dataset.id)) d.open = true; });
    });
  };
  draw();
}

/* ---------- AI assistant with live site preview ---------- */
let chatHist = [];
const AI_ERR = {
  not_configured: 'העוזר עדיין לא מחובר. צריך להוסיף את המפתח ANTHROPIC_API_KEY ב-Supabase (Edge Functions ← Secrets).',
  bad_key: 'המפתח של Anthropic לא תקין. בדקו את הסוד ANTHROPIC_API_KEY ב-Supabase.',
  no_credit: 'נגמרו הקרדיטים בחשבון ה-API של Anthropic. צריך להוסיף קרדיט ב-console.anthropic.com ← Billing.',
  ai_rate_limited: 'יותר מדי בקשות ל-Anthropic ברגע זה. נסו שוב בעוד דקה.',
  rate_limited: 'הגעתם למגבלת השימוש השעתית. נסו שוב מאוחר יותר.',
  forbidden: 'אין לך הרשאה להשתמש בעוזר.',
  unauthorized: 'ההתחברות פגה. התנתקו והתחברו שוב.'
};
const PV_PAGES = [['index.html', 'דף הבית'], ['products.html', 'כל המוצרים'], ['brands.html', 'מותגים'], ['why.html', 'למה פרוטאין סטוק'], ['contact.html', 'צור קשר']];
const PV_PHONE = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="8" height="15" rx="2"/><path d="M9 15h2"/></svg>';
const PV_REFRESH = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5V6h-2.5"/></svg>';
const PV_OPEN = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3.5h5.5V9M16.5 3.5L9 11M8 5H4.5v10.5H15V12"/></svg>';

async function ai() {
  setBar('ai', 'בנייה עם AI', '<button class="btn" id="ai-new">שיחה חדשה</button>');
  const host = pane(); host.classList.add('wide');
  const EX = ['הסתר את כל המוצרים שאזלו', 'העלה ב-5% את המחירים של כל מוצרי Monster', 'שנה את הסרגל העליון ל"משלוח חינם עד סוף השבוע"', 'הראה לי את ההזמנות הממתינות', 'אילו מוצרים נמצאים במבצע?'];
  host.innerHTML = `<div class="ai-split">
    <section class="pv" aria-label="תצוגה מקדימה של האתר"><div class="pv-bar"><select id="pv-page" aria-label="עמוד לתצוגה">${PV_PAGES.map(([u, n]) => `<option value="${u}">${n}</option>`).join('')}</select><span class="pv-s"></span>
      <button class="ib" id="pv-d" aria-pressed="false" aria-label="תצוגת נייד" title="תצוגת נייד">${PV_PHONE}</button><button class="ib" id="pv-r" aria-label="רענון" title="רענון">${PV_REFRESH}</button><a class="ib" id="pv-o" href="index.html" target="_blank" rel="noopener" aria-label="פתיחה בלשונית חדשה" title="פתיחה בלשונית חדשה">${PV_OPEN}</a></div>
      <div class="pv-stage"><div class="pv-frame" id="pv-frame"><iframe id="pv-if" title="האתר" src="index.html"></iframe><div class="pv-busy" id="pv-busy" hidden>מתעדכן…</div></div></div></section>
    <section class="chatp"><div class="chat" id="chat" aria-live="polite"></div><div class="chips" id="ex">${EX.map(t => `<button class="chip" type="button">${esc(t)}</button>`).join('')}</div>
      <form id="af" class="comp"><textarea id="ap" rows="2" maxlength="4000" placeholder="כתבו כל בקשה בעברית…"></textarea><div class="comp-r"><span class="who">הבקשות נחשבות בחשבון ה-API שחיברתם</span><button class="btn pri" id="as">שליחה</button></div></form></section></div>`;
  const $ = s => host.querySelector(s);
  const f = $('#pv-if'), busy = $('#pv-busy'), sel = $('#pv-page'), openA = $('#pv-o');

  /* ---- live preview ---- */
  let keepY = 0;
  const sync = () => {
    try {
      const file = f.contentWindow.location.pathname.split('/').pop() || 'index.html';
      const q = f.contentWindow.location.search;
      let o = [...sel.options].find(x => x.value === file);
      if (!o) { sel.insertAdjacentHTML('beforeend', `<option value="${esc(file)}">${file === 'product.html' ? 'עמוד מוצר' : esc(file)}</option>`); o = sel.lastElementChild; }
      sel.value = file; openA.href = file + q;
    } catch (e) { /* cross-origin: ignore */ }
  };
  f.onload = () => { busy.hidden = true; sync(); try { f.contentWindow.scrollTo(0, keepY); } catch (e) { /* ignore */ } keepY = 0; };
  const reload = () => { try { keepY = f.contentWindow.scrollY; } catch (e) { keepY = 0; } busy.hidden = false; try { f.contentWindow.location.reload(); } catch (e) { f.src = f.src; } };
  const go = url => { keepY = 0; busy.hidden = false; try { f.contentWindow.location.replace(url); } catch (e) { f.src = url; } };
  sel.onchange = () => go(sel.value);
  $('#pv-r').onclick = reload;
  $('#pv-d').onclick = e => { const on = $('#pv-frame').classList.toggle('mobile'); e.currentTarget.setAttribute('aria-pressed', on); };

  /* ---- chat ---- */
  const chat = $('#chat'), ta = $('#ap'), sendBtn = $('#as');
  const paint = () => {
    chat.innerHTML = chatHist.length ? chatHist.map(m => `<div class="m ${m.role}${m.err ? ' err' : ''}"><div class="mt">${esc(m.text)}</div>${(m.actions || []).map(a => `<span class="act">✓ ${esc(a)}</span>`).join('')}</div>`).join('') : '<p class="empty">מה לעשות בחנות? אפשר לשנות מחירים, מלאי וסטטוס, לעדכן את הסרגל העליון והמשלוח, ולראות הזמנות. כל שינוי מופיע באתר משמאל מיד.</p>';
    chat.scrollTop = chat.scrollHeight;
  };
  paint();
  const send = async text => {
    text = text.trim(); if (!text || sendBtn.disabled) return;
    chatHist.push({ role: 'user', text }); ta.value = ''; sendBtn.disabled = true;
    chatHist.push({ role: 'assistant', text: 'עובד על זה…', pending: true }); paint();
    let out = null, code = null;
    try {
      const r = await sb.functions.invoke('admin-assistant', { body: { messages: chatHist.filter(m => !m.pending && !m.err).map(m => ({ role: m.role, content: m.text })) } });
      if (r.error) { try { out = await r.error.context.json(); } catch (e) { out = {}; } code = out.error || 'ai_error'; } else out = r.data;
    } catch (e) { code = 'network'; out = {}; }
    chatHist = chatHist.filter(m => !m.pending);
    if (code) chatHist.push({ role: 'assistant', err: true, text: AI_ERR[code] || (code === 'network' ? 'אין חיבור לשרת. נסו שוב.' : 'משהו השתבש' + (out && out.detail ? ': ' + out.detail : '.')), actions: out.actions });
    else chatHist.push({ role: 'assistant', text: out.reply || 'בוצע.', actions: out.actions });
    sendBtn.disabled = false; paint();
    if ((out.actions || []).length) {   // something changed: show it in the preview
      const t = out.touched || [];
      if (t.length === 1) go('product.html?id=' + encodeURIComponent(t[0]));
      else if (t.length > 1) go('products.html');
      else reload();
    }
  };
  $('#af').onsubmit = e => { e.preventDefault(); send(ta.value); };
  ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(ta.value); } };
  $('#ex').onclick = e => { const b = e.target.closest('.chip'); if (b) { ta.value = b.textContent; ta.focus(); } };
  document.getElementById('ai-new').onclick = () => { chatHist = []; paint(); };
  if (window.__pendingAsk) { const q = window.__pendingAsk; window.__pendingAsk = null; send(q); }
}

/* ---------- settings ---------- */
async function settings() {
  setBar('settings', 'הגדרות');
  pane().innerHTML = '<p class="empty">טוען…</p>';
  const { data, error } = await sb.from('site_settings').select('key,value');
  if (error) { pane().innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  const get = k => (data.find(r => r.key === k) || {}).value || {};
  const ship = get('shipping'), pay = get('payment'), content = get('content');
  pane().innerHTML = `<div class="card" style="display:grid;gap:22px"><div><h2 style="font-size:1.05rem;margin-bottom:10px">משלוח</h2>
    <div class="grid2"><div class="field"><label for="fo">משלוח חינם מעל (₪)</label><input type="number" id="fo" min="0" step="1" value="${Number(ship.free_over) || 0}" dir="ltr"></div>
    <div class="field"><label for="ff">דמי משלוח מתחת לסכום (₪)</label><input type="number" id="ff" min="0" step="0.5" value="${Number(ship.fee) || 0}" dir="ltr"></div></div>
    <p class="who" style="margin:8px 0 0">הסכום מחושב בשרת בעת ביצוע ההזמנה. הטקסטים באתר (למשל "משלוח חינם מעל ₪299") נשארים כפי שהם.</p>
    <button class="btn pri" id="ss" style="margin-top:12px">שמירת הגדרות משלוח</button></div>
    <div><h2 style="font-size:1.05rem;margin-bottom:10px">סרגל עליון באתר</h2><div class="field" style="max-width:560px"><label for="tb">טקסט (ריק = ברירת המחדל)</label><input type="text" id="tb" maxlength="160" value="${esc(content.topbar || '')}"></div><button class="btn pri" id="tbs" style="margin-top:12px">שמירת הסרגל</button></div>
    <div><h2 style="font-size:1.05rem;margin-bottom:6px">סליקה</h2><p style="margin:0">${pay.enabled ? `פעילה — ספק: <b>${esc(pay.provider)}</b>` : 'לא מחוברת. הזמנות נשמרות כ"ממתינה לתשלום" והלקוח מקבל מספר הזמנה וקישור לוואטסאפ.'}</p></div></div>`;
  document.getElementById('tbs').onclick = async e => {
    const topbar = document.getElementById('tb').value.trim().slice(0, 160); e.target.disabled = true;
    const { error } = await sb.from('site_settings').update({ value: { ...content, topbar } }).eq('key', 'content');
    e.target.disabled = false; toast(error ? 'השמירה נכשלה: ' + error.message : 'נשמר');
  };
  document.getElementById('ss').onclick = async e => {
    const free_over = parseFloat(document.getElementById('fo').value) || 0, fee = parseFloat(document.getElementById('ff').value) || 0;
    if (free_over < 0 || fee < 0) { toast('ערך לא תקין'); return; }
    e.target.disabled = true;
    const { error } = await sb.from('site_settings').update({ value: { free_over, fee } }).eq('key', 'shipping');
    e.target.disabled = false; toast(error ? 'השמירה נכשלה: ' + error.message : 'נשמר');
  };
}

/* ---------- boot ---------- */
let current = null;
sb.auth.onAuthStateChange((ev, session) => {
  const id = session ? session.user.id : null;
  if (id === current && ev !== 'SIGNED_OUT') return;
  current = id;
  if (location.hash.includes('access_token')) history.replaceState(null, '', location.pathname);
  if (session) setTimeout(() => enter(session), 0); else showLogin();
});
sb.auth.getSession().then(({ data }) => { if (!data.session && current === null) showLogin(); });
</script>
</body>
