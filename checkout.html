<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>תשלום — פרוטאין סטוק - PROTEIN STOCK</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="img/protein-stock-sports-nutrition-e-commerce-logo.webp">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="ck-body">
<header class="ck-top"><div class="ck-in"><a href="/" class="ck-logo" aria-label="פרוטאין סטוק - חזרה לחנות"><img src="img/protein-stock-sports-nutrition-e-commerce-logo.webp" alt="פרוטאין סטוק" width="130" height="40"></a>
  <a class="ck-bag" href="cart" aria-label="חזרה לעגלה"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3.5h3l2.4 11.2a1.6 1.6 0 0 0 1.6 1.3h8.1a1.6 1.6 0 0 0 1.6-1.2L21 7.5H6.2"/></svg><span class="ck-bagn" id="ck-bagn">0</span></a></div></header>
<main id="main" class="ck-main"><h1 class="ck-h1">תשלום</h1><div class="ck-in" id="ck"></div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/data.js"></script>
<script src="js/catalog.js"></script>
<script src="js/app.js"></script>
<script>
const host = document.getElementById('ck');
const FKEY = 'ps_checkout';
const FIELDS = ['name', 'phone', 'email', 'address', 'apt'];
const VAT = 0.18;   // Israeli VAT; prices already include it
const readStore = st => { try { return JSON.parse(st.getItem(FKEY) || '{}'); } catch (e) { return {}; } };
const readProfile = () => { try { const p = JSON.parse(localStorage.getItem('ps_profile') || '{}'); const o = {}; ['name', 'phone', 'email', 'address'].forEach(k => { if (p[k]) o[k] = p[k]; }); return o; } catch (e) { return {}; } };   // signed-in customer (account page)
const load = () => ({ ...readProfile(), ...readStore(sessionStorage), ...readStore(localStorage) });
const save = () => {
  try {
    const o = {}; FIELDS.forEach(f => { const el = document.getElementById('f-' + f); if (el) o[f] = el.value; });
    sessionStorage.setItem(FKEY, JSON.stringify(o));
    const keep = document.getElementById('f-keep');
    if (keep && keep.checked) localStorage.setItem(FKEY, JSON.stringify(o)); else localStorage.removeItem(FKEY);
    // cart abandonment: keep the draft (phone or email + cart) so the store can follow up if no order comes
    if (window.PSTrack && Cart.items.length) PSTrack.draft({ name: o.name, phone: o.phone, email: o.email, step: String(openStep), total: totals().total,
      items: Cart.items.filter(i => byId(i.id)).map(i => ({ id: i.id, q: i.q, v: i.v || undefined, name: byId(i.id).name.slice(0, 120), price: byId(i.id).price })) });
  } catch (e) { /* ignore */ }
};
const note = () => { try { return sessionStorage.getItem('ps_note') || ''; } catch (e) { return ''; } };
let busy = false, built = false, openStep = 1, giveUp = false, method = 'shipping';
let coupon = null;   // { code, discount } — the discount is always priced by the server for the current cart
const CP_ERR = { coupon_invalid: 'קוד הקופון לא קיים או שאינו פעיל', coupon_expired: 'תוקף הקופון פג', coupon_not_started: 'הקופון עדיין לא בתוקף', coupon_used_up: 'הקופון כבר נוצל', coupon_not_applicable: 'הקופון לא חל על המוצרים שבעגלה', coupon_min_order: 'הקופון תקף בהזמנה מעל ', network: 'אין חיבור לשרת, נסו שוב' };
const cpMsg = d => d.error === 'coupon_min_order' ? CP_ERR.coupon_min_order + money(d.min || 0) : (CP_ERR[d.error] || 'לא הצלחנו לבדוק את הקופון, נסו שוב');
const savedCoupon = () => { try { return sessionStorage.getItem('ps_coupon') || ''; } catch (e) { return ''; } };
const keepCoupon = c => { try { c ? sessionStorage.setItem('ps_coupon', c) : sessionStorage.removeItem('ps_coupon'); } catch (e) { /* ignore */ } };
setTimeout(() => { giveUp = true; if (!built) buildForm(); }, 4000);
const pending = () => Cart.stored.length > Cart.items.filter(i => byId(i.id)).length && !window.__liveReady && !giveUp;

const I = {
  user: '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><rect x="15.5" y="9" width="6" height="8" rx="1"/><path d="M17 12h3M17 14.5h3"/></svg>',
  truck: '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h11v10H2z"/><path d="M13 9h4.5l3.5 3.5V16h-8"/><circle cx="6.5" cy="17.5" r="1.7"/><circle cx="17" cy="17.5" r="1.7"/></svg>',
  card: '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6 15h4"/></svg>',
  tag: '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.6 3H20a1 1 0 0 1 1 1v7.4a1 1 0 0 1-.3.7l-8.6 8.6a1 1 0 0 1-1.4 0l-7.4-7.4a1 1 0 0 1 0-1.4L11.9 3.3a1 1 0 0 1 .7-.3z"/><circle cx="16.5" cy="7.5" r="1.3"/></svg>',
  chev: '<svg class="ck-chev" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l5 5 5-5"/></svg>'
};

const field = (id, label, opts = {}) => `<div class="ck-f"><label for="f-${id}">${label}${opts.opt ? '' : ' <i>*</i>'}</label><input id="f-${id}" type="${opts.type || 'text'}"${opts.ph ? ` placeholder="${esc(opts.ph)}"` : ''}${opts.mode ? ` inputmode="${opts.mode}"` : ''}${opts.ac ? ` autocomplete="${opts.ac}"` : ''}${opts.dir ? ` dir="${opts.dir}"` : ''} value="${esc(opts.v || '')}"><small class="ck-e" id="e-${id}"></small></div>`;

/* the server prices by product id, so lines of the same product with different pack compositions are merged,
   and the chosen compositions travel in the order notes */
function mergedItems() { const m = new Map(); Cart.items.forEach(i => m.set(i.id, (m.get(i.id) || 0) + i.q)); return [...m].map(([id, qty]) => ({ id, qty })); }
function packNotes() { const l = Cart.items.filter(i => i.v).map(i => `${byId(i.id).name.slice(0, 40)} ×${i.q}: ${i.v}`); return l.length ? 'הרכב מארז — ' + l.join(' | ') + '\n' : ''; }
function totals() {
  const sub = Cart.total(), disc = coupon ? Math.min(coupon.discount, sub) : 0;
  const ship = method === 'pickup' ? 0 : shipCost(sub - disc), total = Math.round((sub - disc + ship) * 100) / 100;   // free shipping counts the total after the discount
  return { sub, disc, ship, total, vat: Math.round(total * VAT / (1 + VAT) * 100) / 100 };
}

/* coupon: priced by the same server function that creates the order ({ action: 'quote' } stores nothing) */
async function quote(code) {
  const body = JSON.stringify({ action: 'quote', coupon: code, delivery: method, items: mergedItems() });
  let r, d = {};
  try {
    r = await fetch('/api/create-order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
    if (r.status === 404 || r.status === 503)   // new database not set up yet: legacy Supabase function (remove after the move)
      r = await fetch(LEGACY_SB.url + '/functions/v1/create-order', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: LEGACY_SB.key }, body });
    try { d = await r.json(); } catch (x) { /* empty */ }
  } catch (x) { return { error: 'network' }; }
  return r.ok ? d : { error: d.error || 'server', min: d.min };
}
let cpSeq = 0;
async function applyCoupon(code, quiet) {
  code = String(code || '').trim().toUpperCase().slice(0, 40);
  const e = document.getElementById('e-coupon'), btn = document.getElementById('cp-apply');
  if (!code) { if (e) e.textContent = 'נא להזין קוד קופון'; return; }
  const seq = ++cpSeq;
  if (btn) { btn.disabled = true; btn.textContent = 'בודקים…'; }
  const d = await quote(code);
  if (seq !== cpSeq) return;
  if (btn) { btn.disabled = false; btn.textContent = 'החלה'; }
  if (d.error) {
    const had = coupon; coupon = null; keepCoupon(''); paintCoupon();
    if (!quiet || had) { const el = document.getElementById('e-coupon'); if (el) el.textContent = had ? 'הקופון ' + had.code + ' הוסר: ' + cpMsg(d) : cpMsg(d); openCoupon(true); }
    refresh(); return;
  }
  coupon = { code: d.coupon, discount: Number(d.discount) || 0 };
  keepCoupon(coupon.code); paintCoupon(); refresh();
}
function removeCoupon() { cpSeq++; coupon = null; keepCoupon(''); paintCoupon(); refresh(); }
function openCoupon(on) { const r = document.getElementById('cp-row'), t = document.getElementById('cp-toggle'); if (r) r.hidden = !on; if (t) t.setAttribute('aria-expanded', on); }
function paintCoupon() {
  const box = document.getElementById('ck-coupon'), row = document.getElementById('s-disc-row'); if (!box || !row) return;
  box.hidden = !!coupon; row.hidden = !coupon;
  if (coupon) { document.getElementById('s-cp').textContent = coupon.code; document.getElementById('e-coupon').textContent = ''; const i = document.getElementById('f-coupon'); if (i) i.value = ''; }
}
let rq = 0;
function requote() { if (!coupon) return; clearTimeout(rq); const c = coupon.code; rq = setTimeout(() => applyCoupon(c, true), 350); }
function itemsHtml() {
  return Cart.items.filter(i => byId(i.id)).map(i => { const p = byId(i.id); return `<div class="ck-item"><div class="ck-thumb"><img src="${p.img}" alt="" width="64" height="64"><i>${i.q}</i></div><div class="ck-iname"><span>${esc(p.name)}</span>${i.v ? `<small>הרכב: ${esc(i.v)}</small>` : ''}${p.brand ? `<small>${esc(p.brand)}</small>` : ''}</div><b>${money(p.price * i.q)}</b></div>`; }).join('');
}

const step = (n, key, title, icon, body) => `<section class="ck-step${openStep === n ? ' open' : ''}" data-step="${n}" id="st-${key}">
  <button type="button" class="ck-sh" aria-expanded="${openStep === n}" aria-controls="sb-${key}"><span class="ck-ico">${icon}</span><span class="ck-st"><b>${title}</b><small class="ck-line" id="ln-${key}"></small></span>${I.chev}</button>
  <div class="ck-sb" id="sb-${key}">${body}</div></section>`;

function buildForm() {
  const items = Cart.items.filter(i => byId(i.id));
  if (pending()) { host.innerHTML = '<div class="ct-empty"><p>טוען…</p></div>'; built = false; return; }
  if (!items.length) {
    host.innerHTML = `<div class="ct-empty"><div class="ct-empty-i">🛒</div><h1>העגלה ריקה</h1><p>אין מה לשלם עדיין.</p><a class="btn btn-primary" href="products">לקטלוג המוצרים</a></div>`;
    built = false; return;
  }
  const v = load(), t = totals(), kept = !!Object.keys(readStore(localStorage)).length;
  host.innerHTML = `<div class="ck-grid">
  <form id="ckf" class="ck-steps" novalidate autocomplete="on">
    ${step(1, 'contact', 'פרטי התקשרות', I.user, `
      ${field('name', 'שם מלא', { ph: 'שם מלא', ac: 'name', v: v.name })}
      ${field('phone', 'מספר טלפון נייד', { ph: 'טלפון', type: 'tel', mode: 'tel', ac: 'tel', dir: 'ltr', v: v.phone })}
      ${field('email', 'דוא"ל', { ph: 'כתובת דוא"ל (לאישור הזמנה וקבלה)', type: 'email', mode: 'email', ac: 'email', dir: 'ltr', v: v.email })}
      <label class="ck-check"><input type="checkbox" id="f-keep"${kept ? ' checked' : ''}><span>שמור מידע זה לפעם הבאה (במכשיר הזה בלבד)</span></label>
      <button type="button" class="ck-next" data-next="1">הבא</button>`)}
    ${step(2, 'ship', 'שיטת משלוח', I.truck, `
      <div class="ck-methods" role="radiogroup" aria-label="שיטת משלוח">
        <label class="ck-radio sel" data-m="shipping"><input type="radio" name="ship" value="shipping" checked><span class="ck-dot" aria-hidden="true"></span><span class="ck-rt"><b>משלוח עד הבית</b><small id="ck-shipnote"></small></span><em id="ck-shiprow"></em></label>
        <label class="ck-radio" data-m="pickup" id="ck-pickopt"><input type="radio" name="ship" value="pickup"><span class="ck-dot" aria-hidden="true"></span><span class="ck-rt"><b>איסוף עצמי</b><small>${esc(SITE.address)}</small></span><em>חינם</em></label>
      </div>
      <div id="ck-addr" class="ck-addr">
        ${field('address', 'כתובת מלאה', { ph: 'רחוב, מספר בית ועיר', ac: 'street-address', v: v.address })}
        ${field('apt', 'פרטים נוספים לשליח', { opt: true, ph: 'מספר דירה, קומה, קוד לבניין, הוראות הגעה (לא חובה)', ac: 'address-line2', v: v.apt })}
      </div>
      <div id="ck-pick" class="ck-paybox" hidden><p><b>איסוף עצמי מהחנות</b></p><p>${esc(SITE.address)}</p><p class="ck-small">נעדכן אתכם כשההזמנה מוכנה לאיסוף. שעות פעילות: א׳–ה׳ 09:00–16:00.</p></div>
      <div class="ck-f"><label for="f-notes">הערות להזמנה</label><textarea id="f-notes" rows="3" maxlength="300" placeholder="למשל: להתקשר לפני ההגעה">${esc(note())}</textarea></div>
      <button type="button" class="ck-next" data-next="2">הבא</button>`)}
    ${step(3, 'pay', 'תשלום', I.card, `
      <div class="ck-paybox"><p><b>🔒 תשלום מאובטח</b></p><p>לאחר לחיצה על "בצע הזמנה" תועברו לדף תשלום מוצפן של PayPlus (כרטיס אשראי ועוד). פרטי הכרטיס לא נשמרים באתר שלנו.</p><p class="ck-small">אם התשלום המקוון אינו זמין כרגע, ההזמנה תישמר ונחזור אליכם להשלמת התשלום.</p></div>
      <button type="button" class="ck-next" data-next="3">הבא</button>`)}
    ${step(4, 'items', 'פריטים', I.tag, `<div class="ck-items" id="ck-items">${itemsHtml()}</div><a class="ck-edit" href="cart">עריכת העגלה</a>`)}
  </form>
  <aside class="ck-sum" aria-label="פרטי ההזמנה"><h2>פרטי ההזמנה</h2><hr>
    <div class="ck-coupon" id="ck-coupon"><button type="button" class="ck-cp-toggle" id="cp-toggle" aria-expanded="false" aria-controls="cp-row">יש לך קוד קופון?</button>
      <div class="ck-cp-row" id="cp-row" hidden><label for="f-coupon" class="sr-only">קוד קופון</label><input id="f-coupon" type="text" placeholder="קוד קופון" dir="ltr" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40"><button type="button" id="cp-apply">החלה</button></div>
      <small class="ck-e" id="e-coupon" role="alert"></small></div>
    <div class="ck-sl"><span>סכום ביניים:</span><b id="s-sub">${money(t.sub)}</b></div>
    <div class="ck-sl ck-disc" id="s-disc-row" hidden><span>הנחת קופון <b id="s-cp" dir="ltr"></b> <button type="button" class="ck-cp-x" id="cp-remove" aria-label="הסרת הקופון">הסרה</button></span><b id="s-disc">−${money(t.disc)}</b></div>
    <div class="ck-sl vat"><span>כולל מע"מ:</span><span id="s-vat">${money(t.vat)}</span></div>
    <div class="ck-sl"><span>משלוח:</span><b id="s-ship">${t.ship ? money(t.ship) : 'חינם'}</b></div>
    <hr>
    <div class="ck-sl tot"><span>סה"כ לתשלום:</span><b id="s-tot">${money(t.total)}</b></div>
    <label class="ck-terms"><input type="checkbox" id="f-terms"><span>אני מסכים/ה ל<a href="terms" target="_blank" rel="noopener">תנאי השימוש</a> ול<a href="privacy" target="_blank" rel="noopener">מדיניות הפרטיות</a></span></label>
    <button type="submit" form="ckf" class="ck-submit" id="ck-go" disabled><span id="ck-go-t">בצע הזמנה</span></button>
    <p class="ck-err" id="ck-err" role="alert" hidden></p>
    <small class="ck-e" id="e-terms"></small>
  </aside></div>`;
  built = true;
  const form = document.getElementById('ckf');
  form.addEventListener('input', save);
  form.addEventListener('change', save);
  form.addEventListener('input', e => { if (e.target.id === 'f-notes') { try { sessionStorage.setItem('ps_note', e.target.value.slice(0, 300)); } catch (x) { /* ignore */ } } });
  form.addEventListener('submit', submit);
  form.addEventListener('click', e => {
    const h = e.target.closest('.ck-sh'); if (h) { openAt(+h.parentNode.dataset.step); return; }
    const n = e.target.closest('[data-next]'); if (n) { const k = +n.dataset.next; if (validate(k)) openAt(k + 1); }
  });
  document.getElementById('f-terms').addEventListener('change', e => { document.getElementById('ck-go').disabled = !e.target.checked || busy; document.getElementById('e-terms').textContent = ''; });
  form.addEventListener('change', e => { if (e.target.name === 'ship') setMethod(e.target.value); });
  document.getElementById('cp-toggle').addEventListener('click', () => { openCoupon(true); document.getElementById('f-coupon').focus(); });
  document.getElementById('cp-apply').addEventListener('click', () => applyCoupon(document.getElementById('f-coupon').value));
  document.getElementById('f-coupon').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); applyCoupon(e.target.value); } });
  document.getElementById('f-coupon').addEventListener('input', () => { document.getElementById('e-coupon').textContent = ''; });
  document.getElementById('cp-remove').addEventListener('click', removeCoupon);
  paintCoupon();
  setMethod(method, true);
  paintLines(); paintBag();
  if (!coupon && savedCoupon()) applyCoupon(savedCoupon(), true);
}

function setMethod(m, silent) {
  if (m === 'pickup' && SHIP.pickup === false) m = 'shipping';
  method = m;
  document.querySelectorAll('.ck-radio').forEach(l => { const on = l.dataset.m === m; l.classList.toggle('sel', on); l.querySelector('input').checked = on; });
  const a = document.getElementById('ck-addr'), pk = document.getElementById('ck-pick');
  if (a) a.hidden = m === 'pickup';
  if (pk) pk.hidden = m !== 'pickup';
  paintShipLabels();
  if (!silent) { refresh(); requote(); }
  paintLines();
}
function paintShipLabels() {
  const c = shipCost(totals().sub - totals().disc);
  const row = document.getElementById('ck-shiprow'); if (row) row.textContent = c ? money(c) : 'חינם';
  const nt = document.getElementById('ck-shipnote'); if (nt) nt.textContent = SHIP.free_over > 0 ? ('חינם בהזמנה מעל ' + money(SHIP.free_over) + ' · זמן האספקה יאושר בעת אישור ההזמנה') : 'זמן האספקה יאושר בעת אישור ההזמנה';
  const po = document.getElementById('ck-pickopt'); if (po) po.hidden = SHIP.pickup === false;
  if (SHIP.pickup === false && method === 'pickup') method = 'shipping';
}

function openAt(n) {
  openStep = n;
  document.querySelectorAll('.ck-step').forEach(s => { const o = +s.dataset.step === n; s.classList.toggle('open', o); s.querySelector('.ck-sh').setAttribute('aria-expanded', o); });
  paintLines();
  const el = document.querySelector(`.ck-step[data-step="${n}"]`); if (el) setTimeout(() => el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 30);
}
const val = id => { const el = document.getElementById('f-' + id); return el ? (el.value || '').trim() : ''; };
function paintLines() {
  const set = (k, t) => { const el = document.getElementById('ln-' + k); if (el) el.textContent = t; };
  set('contact', openStep !== 1 && val('name') && val('phone') ? `${val('name')} · ${val('phone')}` : '');
  set('ship', openStep !== 2 ? (method === 'pickup' ? 'איסוף עצמי' : val('address')) : '');
}
function paintBag() { const n = Cart.count(); const b = document.getElementById('ck-bagn'); if (b) { b.textContent = n; b.style.display = n ? 'grid' : 'none'; } }

/* live refresh of totals only (never rebuilds the form, so typing is not lost) */
function refresh() {
  if (!built) { buildForm(); return; }
  if (!Cart.items.filter(i => byId(i.id)).length) { buildForm(); return; }
  const t = totals();
  document.getElementById('ck-items').innerHTML = itemsHtml();
  document.getElementById('s-sub').textContent = money(t.sub);
  document.getElementById('s-disc').textContent = '−' + money(t.disc);
  document.getElementById('s-vat').textContent = money(t.vat);
  document.getElementById('s-ship').textContent = t.ship ? money(t.ship) : 'חינם';
  document.getElementById('s-tot').textContent = money(t.total);
  paintShipLabels();
  paintBag();
}

const E = { name: 'נא להזין שם מלא', phone: 'נא להזין מספר טלפון תקין', email: 'נא להזין כתובת דוא"ל תקינה', address: 'נא להזין כתובת מלאה, כולל עיר' };
const STEP_FIELDS = { 1: ['name', 'phone', 'email'] };
function bad(k) {
  if (k === 'name') return val('name').length < 2;
  if (k === 'phone') return !/^[0-9+\-\s()]{7,20}$/.test(val('phone')) || val('phone').replace(/\D/g, '').length < 9;
  if (k === 'email') return !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val('email'));
  if (k === 'address') return val('address').length < 6;
  return false;
}
function validate(n) {
  const keys = n === 2 ? (method === 'pickup' ? [] : ['address']) : (STEP_FIELDS[n] || []); let first = null;
  keys.forEach(k => { const b = bad(k); document.getElementById('e-' + k).textContent = b ? E[k] : ''; document.getElementById('f-' + k).classList.toggle('bad', b); if (b && !first) first = k; });
  if (first) document.getElementById('f-' + first).focus();
  return !first;
}

const ERR = { ...ORDER_ERR, ...CP_ERR, invalid_email: 'נא להזין כתובת דוא"ל תקינה', invalid_items: 'העגלה אינה תקינה, רעננו את הדף', rate_limited: 'יותר מדי הזמנות בזמן קצר. נסו שוב בעוד כמה דקות.', unavailable: 'חלק מהמוצרים כבר לא זמינים. חזרו לעגלה כדי לעדכן.' };

async function submit(e) {
  e.preventDefault();
  if (busy) return;
  if (!document.getElementById('f-terms').checked) { document.getElementById('e-terms').textContent = 'יש לאשר את התנאים כדי להמשיך'; return; }
  for (const n of [1, 2]) { if (!validate(n)) { openAt(n); return; } }
  const body = { name: val('name'), phone: val('phone'), email: val('email'), delivery: method, address: method === 'pickup' ? '' : (val('address') + (val('apt') ? ' — ' + val('apt') : '')), notes: (packNotes() + val('notes')).slice(0, 300), items: mergedItems(), coupon: coupon ? coupon.code : undefined };
  const btn = document.getElementById('ck-go'), t = document.getElementById('ck-go-t'), err = document.getElementById('ck-err');
  busy = true; btn.disabled = true; t.textContent = 'שולחים…'; err.hidden = true;
  let res, d = {};
  try {
    res = await fetch('/api/create-order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (res.status === 404 || res.status === 503)   // new database not set up yet: legacy Supabase function (remove after the move)
      res = await fetch(LEGACY_SB.url + '/functions/v1/create-order', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: LEGACY_SB.key }, body: JSON.stringify(body) });
    try { d = await res.json(); } catch (x) { /* empty */ }
  } catch (x) { res = null; }
  if (!res || !res.ok) {
    busy = false; btn.disabled = false; t.textContent = 'בצע הזמנה';
    err.textContent = !res ? 'אין חיבור לשרת. בדקו את האינטרנט ונסו שוב.' : (String(d.error || '').startsWith('coupon_') ? 'הקופון ' + (coupon ? coupon.code + ' ' : '') + 'לא הופעל: ' + cpMsg(d) + '. הסרנו אותו — אפשר לבצע את ההזמנה בלעדיו.' : (ERR[d.error] || 'לא הצלחנו לשלוח את ההזמנה. נסו שוב או פנו אלינו בוואטסאפ.'));
    if (String(d.error || '').startsWith('coupon_')) removeCoupon();
    err.hidden = false; err.scrollIntoView({ block: 'center', behavior: 'smooth' });
    return;
  }
  const pay = typeof d.payment_url === 'string' && d.payment_url.startsWith('https://') ? d.payment_url : '';
  try { sessionStorage.setItem('ps_last', JSON.stringify({ number: d.order_number, total: d.total, name: body.name, paid: !!pay, coupon: d.coupon || undefined, shipping: d.shipping, items: body.items.map(i => ({ id: i.id, q: i.qty })) })); sessionStorage.removeItem('ps_note'); if (!pay) sessionStorage.removeItem('ps_coupon'); } catch (x) { /* ignore */ }
  if (pay) { t.textContent = 'מעבירים לתשלום…'; location.href = pay; return; }   // the cart stays until the payment succeeds
  Cart.items = []; Cart.stored = []; try { localStorage.setItem('ps_cart', '[]'); } catch (x) { /* ignore */ }
  location.href = 'order-success?status=received&order=' + encodeURIComponent(d.order_number);
}

// Back from the payment page: the browser restores this page from its cache with the button still locked on
// "מעבירים לתשלום…", so nothing can be submitted. Unlock it whenever the page is shown again from history.
window.addEventListener('pageshow', (ev) => {
  if (!ev.persisted && !busy) return;
  busy = false;
  const btn = document.getElementById('ck-go'), t = document.getElementById('ck-go-t');
  if (btn) btn.disabled = false;
  if (t) t.textContent = 'בצע הזמנה';
});

Cart.load();
buildForm();
window.__rerender = () => { refresh(); requote(); };
initLive();
</script>
</body>
