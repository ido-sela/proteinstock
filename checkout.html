<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>קופה — פרוטאין סטוק</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="img/protein-stock-sports-nutrition-e-commerce-logo.webp">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="ck-body">
<header class="ck-top"><div class="ck-in"><a href="/" class="ck-logo" aria-label="פרוטאין סטוק - חזרה לחנות"><img src="img/protein-stock-sports-nutrition-e-commerce-logo.webp" alt="פרוטאין סטוק" width="130" height="40"></a>
  <a class="ck-bag" href="cart" aria-label="חזרה לעגלה"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l1 12H5L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></a></div></header>
<main id="main" class="ck-shell"><div class="ck-in" id="ck"></div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/data.js"></script>
<script src="js/catalog.js"></script>
<script src="js/app.js"></script>
<script>
const host = document.getElementById('ck');
const FKEY = 'ps_checkout';
const FIELDS = ['email', 'first', 'last', 'address', 'phone'];
const readStore = st => { try { return JSON.parse(st.getItem(FKEY) || '{}'); } catch (e) { return {}; } };
const load = () => ({ ...readStore(sessionStorage), ...readStore(localStorage) });
const save = () => {
  try {
    const o = {}; FIELDS.forEach(f => { const el = document.getElementById('f-' + f); if (el) o[f] = el.value; });
    sessionStorage.setItem(FKEY, JSON.stringify(o));
    const keep = document.getElementById('f-keep');
    if (keep && keep.checked) localStorage.setItem(FKEY, JSON.stringify(o)); else localStorage.removeItem(FKEY);
  } catch (e) { /* ignore */ }
};
const note = () => { try { return sessionStorage.getItem('ps_note') || ''; } catch (e) { return ''; } };
let busy = false, built = false;

const field = (id, label, opts = {}) => `<div class="ck-fl${opts.cls ? ' ' + opts.cls : ''}"><input id="f-${id}" type="${opts.type || 'text'}" placeholder=" "${opts.mode ? ` inputmode="${opts.mode}"` : ''}${opts.ac ? ` autocomplete="${opts.ac}"` : ''}${opts.dir ? ` dir="${opts.dir}"` : ''}${opts.max ? ` maxlength="${opts.max}"` : ''} value="${esc(opts.v || '')}"><label for="f-${id}">${label}</label><small class="ck-e" id="e-${id}"></small></div>`;

function summary() {
  const items = Cart.items.filter(i => byId(i.id));
  const sub = Cart.total(), ship = shipCost(sub);
  const lines = items.map(i => { const p = byId(i.id); return `<div class="ck-item"><div class="ck-thumb"><img src="${p.img}" alt="" width="64" height="64"><i>${i.q}</i></div><div class="ck-iname"><span>${esc(p.name)}</span>${p.brand ? `<small>${esc(p.brand)}</small>` : ''}</div><b>${money(p.price * i.q)}</b></div>`; }).join('');
  return { sub, ship, total: sub + ship, html: `<div class="ck-items">${lines}</div>
    <div class="ck-rows"><div class="ck-sl"><span>סכום ביניים · ${Cart.count()} פריטים</span><b>${money(sub)}</b></div>
    <div class="ck-sl"><span>משלוח</span><b>${ship ? money(ship) : 'חינם'}</b></div>
    <div class="ck-sl tot"><span>סה"כ</span><b><small>ILS</small> ${money(sub + ship)}</b></div>
    <p class="ck-vat">המחירים כוללים מע"מ</p></div>` };
}

function buildForm() {
  const items = Cart.items.filter(i => byId(i.id));
  if (!items.length) {
    host.innerHTML = `<div class="ct-empty"><div class="ct-empty-i">🛒</div><h1>העגלה ריקה</h1><p>אין מה לשלם עדיין.</p><a class="btn btn-primary" href="products">לקטלוג המוצרים</a></div>`;
    built = false; return;
  }
  const v = load(), s = summary(), kept = !!Object.keys(readStore(localStorage)).length;
  host.innerHTML = `<div class="ck-grid">
  <form id="ckf" class="ck-form" novalidate autocomplete="on">
    <section><h2>פרטי קשר</h2>
      ${field('email', 'דואר אלקטרוני (לאישור הזמנה וקבלה)', { type: 'email', mode: 'email', ac: 'email', dir: 'ltr', v: v.email })}
    </section>
    <section><h2>משלוח</h2>
      <div class="ck-2">${field('first', 'שם פרטי', { ac: 'given-name', v: v.first })}${field('last', 'שם משפחה', { ac: 'family-name', v: v.last })}</div>
      ${field('address', 'כתובת מלאה (רחוב, מספר בית, דירה ועיר)', { ac: 'street-address', v: v.address })}
      ${field('phone', 'טלפון נייד', { type: 'tel', mode: 'tel', ac: 'tel', dir: 'ltr', v: v.phone })}
      <label class="ck-check"><input type="checkbox" id="f-keep"${kept ? ' checked' : ''}><span>שמור מידע זה לפעם הבאה (במכשיר הזה בלבד)</span></label>
    </section>
    <section><h3>שיטת משלוח</h3>
      <label class="ck-radio"><input type="radio" name="ship" checked><span class="ck-dot" aria-hidden="true"></span><span class="ck-rt"><b>משלוח עד הבית</b><small>זמן האספקה המדויק יאושר בעת אישור ההזמנה</small></span><em id="ck-shiprow">${s.ship ? money(s.ship) : 'חינם'}</em></label>
    </section>
    <section><h2>תשלום</h2><p class="ck-sub">כל העסקאות מאובטחות ומוצפנות.</p>
      <div class="ck-paybox"><div class="ck-payh"><b>כרטיס אשראי ושיטות נוספות</b><span>🔒 PayPlus</span></div>
        <div class="ck-payb"><p>לחיצה על "לתשלום עכשיו" תעביר אתכם לדף תשלום מאובטח של PayPlus. פרטי הכרטיס לא נשמרים באתר שלנו.</p><p class="ck-small">אם התשלום המקוון אינו זמין כרגע, ההזמנה תישמר ונחזור אליכם להשלמת התשלום.</p></div></div>
    </section>
    <div class="ck-act">
      <label class="ck-check"><input type="checkbox" id="f-terms"><span>קראתי ואני מאשר/ת את <a href="terms" target="_blank" rel="noopener">תנאי השימוש והרכישה</a> ואת <a href="privacy" target="_blank" rel="noopener">מדיניות הפרטיות</a>, כולל זכות ביטול העסקה לפי חוק.</span></label><small class="ck-e" id="e-terms"></small>
      <button class="ck-submit" id="ck-go" type="submit"><span id="ck-go-t">לתשלום עכשיו · ${money(s.total)}</span></button>
      <p class="ck-err" id="ck-err" role="alert" hidden></p>
    </div>
    <nav class="ck-links" aria-label="מדיניות"><a href="terms#cancel">החזרות וביטול עסקה</a><a href="privacy">פרטיות</a><a href="terms">תנאי שימוש</a><a href="contact">צור קשר</a></nav>
  </form>
  <aside class="ck-sum" aria-label="סיכום הזמנה"><button class="ck-sumtoggle" type="button" id="ck-tg" aria-expanded="false"><span>הצגת סיכום ההזמנה ▾</span><b id="ck-tgt">${money(s.total)}</b></button><div class="ck-sumbody" id="ck-sb">${s.html}</div></aside></div>`;
  built = true;
  document.getElementById('ck-tg').onclick = e => { const o = document.getElementById('ck-sb').classList.toggle('open'); e.currentTarget.setAttribute('aria-expanded', o); };
  const form = document.getElementById('ckf');
  form.addEventListener('input', save);
  form.addEventListener('change', save);
  form.addEventListener('submit', submit);
}

/* live refresh of totals only (never rebuilds the form, so typing is not lost) */
function refresh() {
  if (!built) { buildForm(); return; }
  const items = Cart.items.filter(i => byId(i.id));
  if (!items.length) { buildForm(); return; }
  const s = summary();
  document.getElementById('ck-sb').innerHTML = s.html;
  document.getElementById('ck-tgt').textContent = money(s.total);
  document.getElementById('ck-shiprow').textContent = s.ship ? money(s.ship) : 'חינם';
  if (!busy) document.getElementById('ck-go-t').textContent = 'לתשלום עכשיו · ' + money(s.total);
}

const E = { email: 'כתובת האימייל אינה תקינה', first: 'נא להזין שם פרטי', last: 'נא להזין שם משפחה', address: 'נא להזין כתובת מלאה, כולל עיר', phone: 'נא להזין מספר טלפון תקין', terms: 'יש לאשר את התנאים כדי להמשיך' };
const ORDER = ['email', 'first', 'last', 'address', 'phone', 'terms'];
function check() {
  const val = id => (document.getElementById('f-' + id).value || '').trim();
  const bad = {};
  if (val('email') && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val('email'))) bad.email = 1;
  if (val('first').length < 2) bad.first = 1;
  if (val('last').length < 1) bad.last = 1;
  if (val('address').length < 6) bad.address = 1;
  if (!/^[0-9+\-\s()]{7,20}$/.test(val('phone')) || val('phone').replace(/\D/g, '').length < 9) bad.phone = 1;
  if (!document.getElementById('f-terms').checked) bad.terms = 1;
  ORDER.forEach(k => {
    document.getElementById('e-' + k).textContent = bad[k] ? E[k] : '';
    const inp = document.getElementById('f-' + k); if (inp && inp.type !== 'checkbox') inp.parentNode.classList.toggle('bad', !!bad[k]);
  });
  const first = ORDER.find(k => bad[k]);
  if (first) { const t = document.getElementById('f-' + first); t.focus(); t.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  return !first;
}

const ERR = { ...ORDER_ERR, invalid_email: 'כתובת האימייל אינה תקינה', invalid_items: 'העגלה אינה תקינה, רעננו את הדף', rate_limited: 'יותר מדי הזמנות בזמן קצר. נסו שוב בעוד כמה דקות.', unavailable: 'חלק מהמוצרים כבר לא זמינים. חזרו לעגלה כדי לעדכן.' };

async function submit(e) {
  e.preventDefault();
  if (busy || !check()) return;
  const val = id => (document.getElementById('f-' + id).value || '').trim();
  const name = (val('first') + ' ' + val('last')).trim();
  const address = val('address');
  const body = { name, phone: val('phone'), email: val('email'), address, notes: note(), items: Cart.items.map(i => ({ id: i.id, qty: i.q })) };
  const btn = document.getElementById('ck-go'), t = document.getElementById('ck-go-t'), err = document.getElementById('ck-err');
  busy = true; btn.disabled = true; t.textContent = 'שולחים…'; err.hidden = true;
  let res, d = {};
  try {
    res = await fetch(PS_CONFIG.supabaseUrl + '/functions/v1/create-order', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: PS_CONFIG.anonKey }, body: JSON.stringify(body) });
    try { d = await res.json(); } catch (x) { /* empty */ }
  } catch (x) { res = null; }
  if (!res || !res.ok) {
    busy = false; btn.disabled = false; refresh();
    err.textContent = !res ? 'אין חיבור לשרת. בדקו את האינטרנט ונסו שוב.' : (ERR[d.error] || 'לא הצלחנו לשלוח את ההזמנה. נסו שוב או פנו אלינו בוואטסאפ.');
    err.hidden = false; err.scrollIntoView({ block: 'center', behavior: 'smooth' });
    return;
  }
  const pay = typeof d.payment_url === 'string' && d.payment_url.startsWith('https://') ? d.payment_url : '';
  try { sessionStorage.setItem('ps_last', JSON.stringify({ number: d.order_number, total: d.total, name, paid: !!pay })); sessionStorage.removeItem('ps_note'); } catch (x) { /* ignore */ }
  if (pay) { t.textContent = 'מעבירים לתשלום…'; location.href = pay; return; }   // the cart stays until the payment succeeds
  Cart.items = []; Cart.stored = []; try { localStorage.setItem('ps_cart', '[]'); } catch (x) { /* ignore */ }
  location.href = 'thank-you?status=received&order=' + encodeURIComponent(d.order_number);
}

Cart.load();
buildForm();
window.__rerender = refresh;
initLive();
</script>
</body>
</html>
